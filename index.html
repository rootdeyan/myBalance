<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Free personal salary tracker app. Manage monthly income, expenses, balances in EUR/BGN with secure client-side storage. No signup required.">
  <meta name="theme-color" content="#080c14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f0f3fa" media="(prefers-color-scheme: light)">
  <title>RTDN | myBalance €</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'><defs><linearGradient id='g' x1='0' y1='1' x2='0' y2='0'><stop offset='0' stop-color='%235b3df5'/><stop offset='1' stop-color='%2300d68f'/></linearGradient></defs><rect width='56' height='56' rx='16' fill='%23131b2a'/><rect x='13' y='32' width='8' height='14' rx='3' fill='url(%23g)'/><rect x='24' y='22' width='8' height='24' rx='3' fill='url(%23g)'/><rect x='35' y='10' width='8' height='36' rx='3' fill='url(%23g)'/></svg>">
  <style>
    /* ══════════ TOKENS ══════════ */
    :root {
      --bg:           #080c14;
      --surface:      #0e1420;
      --card:         #131b2a;
      --card-hover:   #172034;
      --border:       rgba(255,255,255,0.08);
      --border-hi:    rgba(255,255,255,0.16);
      --text:         #e8edf5;
      --text2:        #8a97ae;   /* raised from #6b7a94 for 4.5:1 contrast */
      --text3:        #aab6c8;

      --primary:      #7c74ff;
      --primary-dim:  rgba(124,116,255,0.16);
      --primary-glow: rgba(124,116,255,0.35);
      --on-primary:   #ffffff;

      --income:       #00d68f;
      --income-dim:   rgba(0,214,143,0.12);
      --income-glow:  rgba(0,214,143,0.3);
      --expense:      #ff6b88;
      --expense-dim:  rgba(255,107,136,0.12);
      --expense-glow: rgba(255,107,136,0.3);
      --carry:        #ffb340;
      --carry-rgb:    255,179,64;

      --radius-sm: 10px;
      --radius:    12px;
      --radius-lg: 16px;
      --radius-xl: 20px;

      --shadow-sm: 0 2px 12px rgba(0,0,0,0.35);
      --shadow:    0 8px 30px rgba(0,0,0,0.45);
      --shadow-lg: 0 18px 60px rgba(0,0,0,0.6);

      --tap: 44px;
      --gutter: 16px;

      --ease-out:    cubic-bezier(.22,1,.36,1);
      --ease-spring: cubic-bezier(.34,1.56,.64,1);
      --hairline:    inset 0 1px 0 rgba(255,255,255,0.06);
      --edge:        linear-gradient(135deg, rgba(124,116,255,0.55), rgba(255,255,255,0.06) 38%, rgba(255,255,255,0.04) 62%, rgba(0,214,143,0.4));
      --dots:        rgba(255,255,255,0.035);
    }

    [data-theme="light"] {
      --bg:          #f0f3fa;
      --surface:     #ffffff;
      --card:        #f5f7fc;
      --card-hover:  #eef2fb;
      --border:      rgba(15,23,42,0.08);
      --border-hi:   rgba(15,23,42,0.16);
      --text:        #0d1626;
      --text2:       #5b6880;   /* raised from #8494ac for contrast */
      --text3:       #3f4b60;
      --primary:     #5046e4;
      --primary-dim: rgba(80,70,228,0.1);
      --primary-glow:rgba(80,70,228,0.2);
      --income:      #00875a;
      --income-dim:  rgba(0,135,90,0.1);
      --income-glow: rgba(0,135,90,0.2);
      --expense:     #d6203f;
      --expense-dim: rgba(214,32,63,0.08);
      --expense-glow:rgba(214,32,63,0.2);
      --carry:       #b36b00;
      --carry-rgb:   179,107,0;
      --shadow-sm:   0 1px 3px rgba(15,23,42,0.06), 0 2px 12px rgba(15,23,42,0.05);
      --shadow:      0 6px 30px rgba(15,23,42,0.08);
      --shadow-lg:   0 16px 60px rgba(15,23,42,0.16);
      --hairline:    inset 0 1px 0 rgba(255,255,255,0.9);
      --edge:        linear-gradient(135deg, rgba(80,70,228,0.45), rgba(15,23,42,0.06) 38%, rgba(15,23,42,0.05) 62%, rgba(0,135,90,0.35));
      --dots:        rgba(15,23,42,0.05);
    }

    /* ══════════ BASE ══════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Roboto', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;      /* the container scrolls, so the background stays fixed */
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    /* Slow drifting aurora + faint dot grid behind everything */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(var(--dots) 1px, transparent 1px);
      background-size: 22px 22px;
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
              mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
    }
    @keyframes aurora {
      0%   { transform: translate3d(0,0,0) scale(1); }
      50%  { transform: translate3d(-4%,3%,0) scale(1.08); }
      100% { transform: translate3d(3%,-2%,0) scale(1.04); }
    }
    body::before {
      content: '';
      position: fixed; inset: -12%; z-index: 0; pointer-events: none;
      animation: aurora 26s ease-in-out infinite alternate;
      will-change: transform;
      background:
        radial-gradient(ellipse 60% 40% at 15% 5%,  rgba(124,116,255,0.09) 0%, transparent 65%),
        radial-gradient(ellipse 50% 35% at 85% 85%, rgba(0,214,143,0.06) 0%, transparent 65%),
        radial-gradient(ellipse 40% 30% at 65% 30%, rgba(255,107,136,0.04) 0%, transparent 60%);
    }
    body[data-theme="light"]::before {
      background:
        radial-gradient(ellipse 60% 40% at 15% 5%,  rgba(80,70,228,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 50% 35% at 85% 85%, rgba(0,135,90,0.05) 0%, transparent 65%);
    }

    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

    .container {
      position: relative; z-index: 1;
      height: 100%;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding:
        calc(12px + env(safe-area-inset-top))
        calc(var(--gutter) + env(safe-area-inset-right))
        calc(40px + env(safe-area-inset-bottom))
        calc(var(--gutter) + env(safe-area-inset-left));
    }
    .shell { max-width: 560px; margin: 0 auto; }

    /* ══════════ HEADER ══════════ */
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 18px; padding-top: 4px;
    }
    .header-brand { min-width: 0; display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      flex-shrink: 0; width: 46px; height: 46px;
      filter: drop-shadow(0 6px 16px rgba(91,61,245,0.35));
    }
    .brand-mark .bar {
      transform-box: fill-box; transform-origin: 50% 100%;
      animation: barUp .9s var(--ease-spring) both;
    }
    .brand-mark .b2 { animation-delay: .12s; }
    .brand-mark .b3 { animation-delay: .24s; }
    @keyframes barUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .brand-text { min-width: 0; }
    .brand-name {
      font-size: clamp(1.3rem, 5vw, 1.65rem);
      font-weight: 700; letter-spacing: -0.6px; line-height: 1.1;
      white-space: nowrap;
    }
    .brand-word {
      background: linear-gradient(180deg, #ffffff 20%, #c9c2ff 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    [data-theme="light"] .brand-word { background-image: linear-gradient(180deg, #0d1626 30%, #4b3fd6 100%); }
    .brand-euro { color: var(--income); margin-left: 0.2em; }
    .live-date {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Roboto Mono', monospace; font-size: 0.75rem;
      color: var(--text2); margin-top: 5px; letter-spacing: 0.2px;
      white-space: nowrap; overflow: hidden;
    }
    .brand-tag {
      font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 0.68rem;
      letter-spacing: 2.5px; color: var(--text3);
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--income); flex-shrink: 0;
      box-shadow: 0 0 0 0 var(--income-glow); animation: livePulse 2s ease-out infinite;
    }
    @keyframes livePulse { 0% { box-shadow: 0 0 0 0 var(--income-glow); } 70%,100% { box-shadow: 0 0 0 7px transparent; } }
    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .icon-btn {
      width: var(--tap); height: var(--tap);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      display: grid; place-items: center;
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.auto-active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }

    /* ══════════ LAYOUT ══════════ */
    .layout { display: flex; flex-direction: column; gap: 18px; }
    .side   { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    .main   { min-width: 0; }

    .section-title {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--text2);
    }

    /* ══════════ FORM ══════════ */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 12px;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-card.editing { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim), var(--shadow); }
    .form-head { display: flex; align-items: center; justify-content: space-between; min-height: 20px; }
    .edit-badge {
      font-size: 0.75rem; font-weight: 700; color: var(--primary);
      background: var(--primary-dim); padding: 3px 10px; border-radius: 99px;
    }

    .form-grid { display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label { font-size: 0.8rem; font-weight: 500; color: var(--text3); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }

    input {
      font-family: inherit; font-size: 1rem; color: var(--text);
      background: var(--card);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius-sm);
      padding: 0 14px; height: 48px; width: 100%;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: var(--text2); opacity: 0.8; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
    input[type=number] { appearance: textfield; -moz-appearance: textfield; font-family: 'Roboto Mono', monospace; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* Income / Expense segmented control */
    .seg {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      height: 48px; padding: 4px;
      background: var(--card); border: 1px solid var(--border-hi);
      border-radius: var(--radius-sm);
    }
    .seg-btn {
      border: none; border-radius: 7px; background: transparent;
      color: var(--text2); font-size: 0.9rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .2s, color .2s;
      -webkit-tap-highlight-color: transparent;
    }
    /* Sliding pill behind the active option */
    .seg { position: relative; }
    .seg::before {
      content: ''; position: absolute; top: 4px; bottom: 4px; left: 4px;
      width: calc(50% - 6px); border-radius: 7px;
      background: var(--income-dim); box-shadow: inset 0 0 0 1px var(--income);
      transition: transform .45s var(--ease-spring), background .3s, box-shadow .3s;
    }
    .seg[data-type="expense"]::before {
      transform: translateX(calc(100% + 4px));
      background: var(--expense-dim); box-shadow: inset 0 0 0 1px var(--expense);
    }
    .seg-btn { position: relative; z-index: 1; }
    .seg-btn[aria-checked="true"][data-type="income"]  { color: var(--income); }
    .seg-btn[aria-checked="true"][data-type="expense"] { color: var(--expense); }

    .btn-row { display: flex; gap: 10px; }
    .btn-primary {
      flex: 1; height: 50px;
      border-radius: var(--radius-sm); border: none;
      background: linear-gradient(135deg, #6c63ff 0%, #9b6cfe 100%);
      color: var(--on-primary); font-size: 1rem; font-weight: 700; letter-spacing: 0.3px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 18px rgba(108,99,255,0.35);
      transition: transform .12s, box-shadow .2s, filter .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active { transform: scale(0.98); }
    [data-theme="light"] .btn-primary { background: linear-gradient(135deg, #5046e4 0%, #7c3aed 100%); }

    .btn-ghost {
      height: 50px; padding: 0 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hi); background: var(--card);
      color: var(--text3); font-weight: 600; cursor: pointer;
    }

    .menu-container { position: relative; }
    .menu-btn-icon {
      width: 50px; height: 50px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hi); background: var(--card);
      color: var(--text2);
      display: grid; place-items: center; cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .menu-dropdown {
      display: none; position: absolute; bottom: calc(100% + 8px); right: 0;
      background: var(--surface); border: 1px solid var(--border-hi);
      border-radius: var(--radius); min-width: 200px; z-index: 1000;
      box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .menu-dropdown.show { display: block; animation: pop .18s cubic-bezier(.4,0,.2,1); }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .menu-item {
      min-height: var(--tap); padding: 0 16px; width: 100%;
      border: none; background: transparent; cursor: pointer; text-align: left;
      color: var(--text3); font-size: 0.9rem; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
    }
    .menu-item:not(:last-child) { border-bottom: 1px solid var(--border); }

    /* ══════════ SUMMARY ══════════ */
    .summary-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .summary-month { font-size: 0.85rem; font-weight: 600; color: var(--text3); }
    .summary-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 14px 14px 18px;
      position: relative; overflow: hidden; min-width: 0;
      box-shadow: var(--shadow-sm);
    }
    .stat-card::before {
      content: ''; position: absolute; top: 14px; bottom: 14px; left: 0;
      width: 3px; border-radius: 0 3px 3px 0;
    }
    .income-card::before  { background: var(--income);  box-shadow: 0 0 10px var(--income-glow); }
    .expense-card::before { background: var(--expense); box-shadow: 0 0 10px var(--expense-glow); }
    .carry-card::before   { background: var(--carry); }
    .balance-card::before { background: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
    .balance-neg::before  { background: var(--expense); box-shadow: 0 0 10px var(--expense-glow); }
    .carry-card { background: rgba(var(--carry-rgb), 0.06); border-color: rgba(var(--carry-rgb), 0.22); }

    .stat-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      margin-bottom: 8px;
    }
    .stat-eur {
      font-family: 'Roboto Mono', monospace;
      font-size: clamp(1.05rem, 4.6vw, 1.3rem);
      font-weight: 700; line-height: 1.1; letter-spacing: -0.5px;
      overflow-wrap: anywhere;
    }
    .income-card  :is(.stat-label,.stat-eur) { color: var(--income); }
    .expense-card :is(.stat-label,.stat-eur) { color: var(--expense); }
    .carry-card   :is(.stat-label,.stat-eur) { color: var(--carry); }
    .balance-card :is(.stat-label,.stat-eur) { color: var(--primary); }
    .balance-neg  :is(.stat-label,.stat-eur) { color: var(--expense); }
    .stat-bgn { font-family: 'Roboto Mono', monospace; font-size: 0.75rem; color: var(--text2); margin-top: 6px; }

    .stat-card.full-width, .spend-row { grid-column: 1 / -1; }
    .balance-card.full-width .stat-eur, .balance-neg.full-width .stat-eur { font-size: clamp(1.4rem, 6vw, 1.8rem); }

    .spend-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: var(--shadow-sm);
    }
    .ring-wrap { position: relative; flex-shrink: 0; width: 60px; height: 60px; }
    .ring-svg { width: 60px; height: 60px; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: var(--border-hi); stroke-width: 3.5; }
    .ring-fill  { fill: none; stroke-width: 3.5; stroke-linecap: round; transition: stroke-dasharray .8s cubic-bezier(.4,0,.2,1); }
    .ring-label {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: 700;
    }
    .spend-info { flex: 1; min-width: 0; }
    .spend-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; }
    .spend-text { font-size: 0.875rem; color: var(--text3); line-height: 1.5; }
    .spend-text strong { font-family: 'Roboto Mono', monospace; color: var(--text); }

    /* ══════════ MONTH NAV ══════════ */
    .month-nav { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    .month-pill, .prev-months-btn {
      min-height: 40px; padding: 0 16px;
      border-radius: 99px; border: 1px solid var(--border-hi);
      background: var(--surface); color: var(--text3);
      font-size: 0.875rem; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background .2s, border-color .2s, color .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .month-pill.active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 700; }
    .prev-months-wrap { position: relative; }
    .prev-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      background: var(--surface); border: 1px solid var(--border-hi);
      border-radius: var(--radius); min-width: 200px; max-height: 320px; overflow-y: auto;
      z-index: 1000; box-shadow: var(--shadow-lg);
    }
    .prev-dropdown.show { display: block; animation: pop .18s cubic-bezier(.4,0,.2,1); }
    .prev-group { border-bottom: 1px solid var(--border); padding: 6px 0; }
    .prev-group:last-child { border-bottom: none; }
    .prev-group-title { padding: 8px 16px 4px; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--primary); }
    .prev-item {
      display: block; width: 100%; min-height: 40px; padding: 0 16px;
      border: none; background: transparent; text-align: left; cursor: pointer;
      font-size: 0.9rem; color: var(--text3); transition: background .15s, color .15s;
    }
    .prev-item.active { color: var(--primary); font-weight: 600; background: var(--primary-dim); }

    /* ══════════ MONTH CARD ══════════ */
    .month-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-xl); overflow: hidden;
      box-shadow: var(--shadow);
    }

    .carry-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px;
      background: rgba(var(--carry-rgb), 0.07);
      border-bottom: 1px solid rgba(var(--carry-rgb), 0.18);
    }
    .carry-left { display: flex; align-items: center; gap: 8px; color: var(--carry); font-size: 0.875rem; font-weight: 500; }
    .carry-right { text-align: right; }
    .carry-eur { font-family: 'Roboto Mono', monospace; font-size: 0.95rem; font-weight: 700; color: var(--carry); white-space: nowrap; }
    .carry-bgn { font-family: 'Roboto Mono', monospace; font-size: 0.75rem; color: var(--text2); }

    .tx-list { max-height: 60vh; overflow-y: auto; overscroll-behavior: contain; }
    .tx-list::-webkit-scrollbar { width: 6px; }
    .tx-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

    .tx-row {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas: "desc amount" "actions actions";
      align-items: center; column-gap: 12px; row-gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      border-left: 3px solid transparent;
      transition: background .15s;
    }
    .tx-row:first-child { border-top: none; }
    .tx-row.income-row  { border-left-color: var(--income); }
    .tx-row.expense-row { border-left-color: var(--expense); }
    .tx-main   { grid-area: desc; min-width: 0; }
    .tx-amount { grid-area: amount; text-align: right; }
    .tx-actions { grid-area: actions; display: flex; gap: 8px; justify-content: flex-end; }

    .tx-desc { font-size: 0.95rem; font-weight: 500; color: var(--text); overflow-wrap: anywhere; line-height: 1.35; }
    .tx-meta { font-family: 'Roboto Mono', monospace; font-size: 0.75rem; color: var(--text2); margin-top: 3px; }
    .tx-eur  { font-family: 'Roboto Mono', monospace; font-size: 0.95rem; font-weight: 700; white-space: nowrap; }
    .tx-eur.income  { color: var(--income); }
    .tx-eur.expense { color: var(--expense); }
    .tx-bgn { font-family: 'Roboto Mono', monospace; font-size: 0.75rem; color: var(--text2); margin-top: 3px; white-space: nowrap; }

    .btn-action {
      min-width: var(--tap); height: 36px; padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hi); background: var(--card);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer; color: var(--text3); font-size: 0.8rem; font-weight: 500;
      transition: background .15s, border-color .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-action:active { transform: scale(0.95); }

    .empty-state { padding: 40px 20px; text-align: center; color: var(--text2); font-size: 0.95rem; }
    .empty-state svg { margin: 0 auto 12px; display: block; opacity: 0.5; }
    .empty-state small { display: block; margin-top: 4px; font-size: 0.8rem; }

    /* ══════════ TOAST ══════════ */
    .indicator {
      display: none; position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--border-hi); color: var(--text);
      padding: 12px 20px; border-radius: 99px;
      font-size: 0.875rem; font-weight: 500;
      z-index: 2000; box-shadow: var(--shadow-lg);
      white-space: nowrap; max-width: calc(100vw - 32px);
    }
    .indicator.show { display: block; animation: toastIn .3s cubic-bezier(.34,1.56,.64,1); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(16px) scale(.92); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    /* ══════════ GUIDE TOUR ══════════ */
    #guide-highlight {
      position: fixed; pointer-events: none; border-radius: 18px; z-index: 9998;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.75);
      outline: 2px solid var(--primary); outline-offset: 4px;
      transition: left .32s cubic-bezier(.4,0,.2,1), top .32s cubic-bezier(.4,0,.2,1),
                  width .32s cubic-bezier(.4,0,.2,1), height .32s cubic-bezier(.4,0,.2,1);
    }
    #guide-tooltip {
      position: fixed; z-index: 9999;
      background: var(--surface); border: 1px solid var(--border-hi);
      border-radius: var(--radius-lg); padding: 20px 20px 16px;
      max-width: 340px; width: calc(100vw - 32px);
      box-shadow: var(--shadow-lg);
    }
    .guide-title { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .guide-body  { font-size: 0.9rem; color: var(--text3); line-height: 1.6; margin-bottom: 16px; }
    .guide-footer { display: flex; align-items: center; gap: 8px; }
    #guide-skip, #guide-next {
      min-height: 40px; padding: 0 16px; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    #guide-skip { background: transparent; border: 1px solid var(--border-hi); color: var(--text2); }
    #guide-next { background: var(--primary); border: none; color: var(--on-primary); }
    #guide-counter { flex: 1; text-align: center; font-size: 0.8rem; color: var(--text2); }

    /* ══════════ PREMIUM SURFACES ══════════ */
    .form-card, .stat-card, .spend-row, .month-card {
      -webkit-backdrop-filter: blur(14px) saturate(140%);
              backdrop-filter: blur(14px) saturate(140%);
    }
    .stat-card, .spend-row, .month-card { box-shadow: var(--hairline), var(--shadow-sm); }
    .month-card { box-shadow: var(--hairline), var(--shadow); }

    /* Gradient hairline edge on the hero surfaces */
    .form-card, .balance-card, .balance-neg {
      border: 1px solid transparent;
      background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--edge) border-box;
    }
    .form-card { box-shadow: var(--hairline), var(--shadow); }
    .form-card.editing { box-shadow: 0 0 0 3px var(--primary-dim), var(--shadow); }

    /* Balance is the hero card: soft colored glow from the top-left corner */
    .balance-card, .balance-neg { padding-top: 16px; padding-bottom: 16px; }
    .balance-card {
      background:
        radial-gradient(120% 140% at 0% 0%, var(--primary-dim), transparent 55%) padding-box,
        linear-gradient(var(--surface), var(--surface)) padding-box,
        var(--edge) border-box;
    }
    .balance-neg {
      background:
        radial-gradient(120% 140% at 0% 0%, var(--expense-dim), transparent 55%) padding-box,
        linear-gradient(var(--surface), var(--surface)) padding-box,
        var(--edge) border-box;
    }
    .stat-card { transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out); }

    /* Primary button: light sweep on hover, soft press */
    .btn-primary { position: relative; overflow: hidden; isolation: isolate; }
    .btn-primary::after {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);
      transform: translateX(-120%);
    }
    .btn-primary > * { position: relative; }
    .btn-primary:active { transform: scale(0.97); transition-duration: .08s; }

    /* ══════════ MOTION ══════════ */
    @keyframes rise   { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes rowIn  { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @keyframes newRow { 0% { background: var(--primary-dim); } 100% { background: transparent; } }
    @keyframes spinIn { from { transform: rotate(-120deg) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

    /* Page load: sections rise in sequence */
    .app-header, .form-card, #summary, .main { animation: rise .8s var(--ease-out) backwards; }
    .form-card { animation-delay: .08s; }
    #summary   { animation-delay: .16s; }
    .main      { animation-delay: .24s; }

    /* First render and month switch: cards and rows cascade in */
    .enter .stat-card, .enter .spend-row { animation: rise .7s var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
    .enter .month-card { animation: rise .7s var(--ease-out) backwards; }
    .enter .tx-row { animation: rowIn .5s var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 12) * 40ms + 150ms); }
    .tx-row.tx-new { animation: rowIn .5s var(--ease-out) backwards, newRow 1.8s ease-out .3s; }

    #theme-toggle svg { animation: spinIn .55s var(--ease-spring); }
    .ring-fill { transition: stroke-dasharray 1.2s var(--ease-out) .25s; }

    /* ══════════ HOVER (mouse only — no sticky hover on touch) ══════════ */
    @media (hover: hover) {
      .icon-btn:hover { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }
      .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 8px 28px rgba(108,99,255,0.5); transform: translateY(-1px); }
      .btn-primary:hover::after { transform: translateX(120%); transition: transform .8s var(--ease-out); }
      .stat-card:hover { transform: translateY(-3px); box-shadow: var(--hairline), var(--shadow); }
      .brand-mark:hover .bar { animation: barUp .7s var(--ease-spring) both; }
      .brand-mark:hover .b2 { animation-delay: .08s; }
      .brand-mark:hover .b3 { animation-delay: .16s; }
      .btn-ghost:hover, .menu-btn-icon:hover { border-color: var(--primary); color: var(--primary); }
      .menu-item:hover, .prev-item:hover { background: var(--primary-dim); color: var(--primary); }
      .month-pill:not(.active):hover, .prev-months-btn:hover { border-color: var(--primary); color: var(--primary); }
      .seg-btn[aria-checked="false"]:hover { color: var(--text); }
      .tx-row:hover { background: var(--card-hover); }
      .btn-action.edit-btn:hover { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }
      .btn-action.del-btn:hover  { background: var(--expense-dim); border-color: var(--expense); color: var(--expense); }
      #guide-skip:hover { border-color: var(--expense); color: var(--expense); }
      #guide-next:hover { filter: brightness(1.1); }
    }

    /* ══════════ RESPONSIVE ══════════ */
    /* Phones: actions sit on their own row with text labels */
    @media (max-width: 479px) {
      .live-date .full { display: none; }
    }
    @media (min-width: 480px) {
      .live-date .short { display: none; }
      .tx-row {
        grid-template-columns: 1fr auto auto;
        grid-template-areas: "desc amount actions";
      }
      .btn-action .lbl { display: none; }
      .btn-action { width: 40px; min-width: 40px; height: 40px; padding: 0; }
    }

    /* Tablets */
    @media (min-width: 768px) {
      :root { --gutter: 28px; }
      .shell { max-width: 820px; }
      .app-header { margin-bottom: 24px; }
      .form-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
      .form-row  { grid-template-columns: 1fr 1fr; }
      .summary-panel { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
      .tx-row { padding: 14px 20px; }
      .tx-list { max-height: 65vh; }
    }

    /* Desktop: two-column dashboard, sidebar stays put while history scrolls */
    @media (min-width: 1080px) {
      :root { --gutter: 40px; }
      .shell { max-width: 1240px; }
      .container { padding-top: 24px; }
      .layout { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 28px; align-items: start; }
      .side { position: sticky; top: 0; }
      .form-grid { display: flex; flex-direction: column; gap: 12px; }
      .summary-panel { grid-template-columns: 1fr 1fr; }
      .tx-list { max-height: calc(100dvh - 190px); }
      .stat-eur { font-size: 1.3rem; }
    }
    @media (min-width: 1440px) {
      .shell { max-width: 1360px; }
      .layout { grid-template-columns: 440px minmax(0, 1fr); }
    }

    /* Short landscape phones: don't trap the list in a tiny scroll box */
    @media (max-height: 500px) and (orientation: landscape) {
      .tx-list { max-height: none; }
      .side { position: static; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<div class="container">
<div class="shell">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-brand">
      <svg class="brand-mark" viewBox="0 0 56 56" aria-hidden="true">
        <defs>
          <linearGradient id="bm-bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5b3df5"/><stop offset="1" stop-color="#00d68f"/></linearGradient>
          <linearGradient id="bm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2538"/><stop offset="1" stop-color="#0c111c"/></linearGradient>
        </defs>
        <rect x=".5" y=".5" width="55" height="55" rx="16" fill="url(#bm-bg)" stroke="rgba(255,255,255,.14)"/>
        <rect class="bar b1" x="13" y="32" width="8" height="14" rx="3" fill="url(#bm-bar)"/>
        <rect class="bar b2" x="24" y="22" width="8" height="24" rx="3" fill="url(#bm-bar)"/>
        <rect class="bar b3" x="35" y="10" width="8" height="36" rx="3" fill="url(#bm-bar)"/>
      </svg>
      <div class="brand-text">
        <h1 class="brand-name" aria-label="RTDN myBalance €"><span class="brand-word">myBalance</span><span class="brand-euro">€</span></h1>
        <div class="live-date"><span class="brand-tag">RTDN</span><span class="live-dot" aria-hidden="true"></span><span id="live-date"></span></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="auto-theme-btn" aria-label="Auto theme" title="Auto theme: follows device">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle light or dark theme" title="Toggle theme"></button>
      <button class="icon-btn" id="guide-btn" aria-label="Show guide" title="Show guide">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="side">

      <!-- FORM -->
      <form class="form-card" id="tx-form" aria-label="Add transaction" novalidate onsubmit="return false">
        <div class="form-head">
          <span class="section-title" id="form-title">New transaction</span>
          <span class="edit-badge" id="edit-badge" hidden>Editing</span>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="desc">Description</label>
            <input id="desc" placeholder="e.g. Salary, Groceries" maxlength="100" autocomplete="off" enterkeyhint="next">
          </div>
          <div class="field">
            <label for="amount">Amount (€)</label>
            <input id="amount" type="number" step="0.01" min="0.01" max="999999.99" placeholder="0.00" inputmode="decimal" enterkeyhint="done">
          </div>
        </div>
        <div class="field">
          <span class="field-label sr-only" id="type-label">Type</span>
          <div class="seg" role="radiogroup" aria-labelledby="type-label">
            <button type="button" class="seg-btn" role="radio" data-type="income" aria-checked="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              Income
            </button>
            <button type="button" class="seg-btn" role="radio" data-type="expense" aria-checked="false">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
              Expense
            </button>
          </div>
          <select id="type" hidden>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div class="btn-row">
          <button type="button" class="btn-ghost" id="cancel-edit" hidden>Cancel</button>
          <button type="button" class="btn-primary" id="add">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span id="add-label">Add Transaction</span>
          </button>
          <div class="menu-container">
            <button type="button" class="menu-btn-icon" id="menu-btn" aria-label="Data backup menu" aria-haspopup="true" aria-expanded="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
              </svg>
            </button>
            <div id="menu-dropdown" class="menu-dropdown" role="menu">
              <button type="button" role="menuitem" class="menu-item" onclick="FileManager.exportToTxt()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download backup
              </button>
              <button type="button" role="menuitem" class="menu-item" onclick="document.getElementById('file-input').click()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Upload backup
              </button>
            </div>
          </div>
        </div>
        <input id="file-input" type="file" accept=".txt" hidden>
      </form>

      <!-- SUMMARY -->
      <section id="summary" aria-label="Month summary"></section>
    </aside>

    <!-- MONTHS -->
    <main class="main">
      <section id="months" aria-label="Transactions by month"></section>
    </main>
  </div>

  <div id="indicator" class="indicator" role="status" aria-live="polite"></div>

</div>
</div>

<!-- GUIDE TOUR -->
<div id="guide-highlight" style="display:none;"></div>
<div id="guide-tooltip" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="guide-title">
  <div class="guide-title" id="guide-title"></div>
  <div class="guide-body" id="guide-body"></div>
  <div class="guide-footer">
    <button id="guide-skip">Skip</button>
    <span id="guide-counter"></span>
    <button id="guide-next">Next</button>
  </div>
</div>

<script>
/* ════════════ CONFIG ════════════ */
const CONFIG = {
  STORAGE_KEY: 'salary-tracker-monthly-v3',
  THEME_KEY: 'salary-tracker-theme',
  EUR_TO_BGN: 1.95583,
  MAX_DESC_LENGTH: 100,
  MAX_AMOUNT: 999999.99,
  MIN_AMOUNT: 0.01,
  RATE_LIMIT_MS: 300,
};
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let _monthDropdownEl = null;

const STATE = {
  months: (() => { try { return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || '{}') || {}; } catch { return {}; } })(),
  editing: null,
  selectedMonth: null,
  lastActionTime: Date.now(),
  renderTimeout: null
};

/* ════════════ SECURITY ════════════ */
const Security = {
  checkRateLimit() {
    const now = Date.now();
    if (now - STATE.lastActionTime < CONFIG.RATE_LIMIT_MS) return false;
    STATE.lastActionTime = now;
    return true;
  },
  validateInput(desc, amt, type) {
    if (!desc || typeof desc !== 'string') return false;
    if (desc.trim().length === 0 || desc.length > CONFIG.MAX_DESC_LENGTH) return false;
    const amount = Number(amt);
    if (isNaN(amount) || amount < CONFIG.MIN_AMOUNT || amount > CONFIG.MAX_AMOUNT) return false;
    if (!['income', 'expense'].includes(type)) return false;
    return true;
  },
  sanitizeInput(str) {
    if (typeof str !== 'string') return '';
    return str.slice(0, CONFIG.MAX_DESC_LENGTH).replace(/[<>]/g, '').trim();
  }
};

/* ════════════ FORMATTER ════════════ */
const Formatter = {
  getMonthKey(d = new Date()) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  },
  monthLabel(key) {
    const [y, m] = key.split('-');
    return `${MONTH_NAMES[parseInt(m) - 1]} ${y}`;
  },
  formatDate(timestamp) {
    try {
      const d = new Date(timestamp);
      const dd  = String(d.getDate()).padStart(2, '0');
      const mm  = String(d.getMonth() + 1).padStart(2, '0');
      const yy  = String(d.getFullYear()).slice(-2);
      const hh  = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${dd}.${mm}.${yy} | ${hh}:${min}`;
    } catch { return 'Invalid Date'; }
  },
  convertToBGN(eur) {
    return (eur * CONFIG.EUR_TO_BGN).toFixed(2);
  },
  filenameDateStamp() {
    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${p(now.getDate())}.${p(now.getMonth() + 1)}.${String(now.getFullYear()).slice(-2)} - ${p(now.getHours())}.${p(now.getMinutes())}.${p(now.getSeconds())}`;
  }
};

/* ════════════ DATA MANAGER ════════════ */
const DataManager = {
  save() {
    try {
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STATE.months));
      this.showIndicator('✓ Saved');
      return true;
    } catch (e) {
      this.showIndicator('✕ Save failed');
      return false;
    }
  },
  getOrCreateMonth(key) {
    if (!STATE.months[key]) {
      let carry = 0;
      const [y, m] = key.split('-').map(Number);
      let py = y, pm = m - 1;
      if (pm === 0) { pm = 12; py--; }
      const pk = `${py}-${String(pm).padStart(2, '0')}`;
      if (STATE.months[pk]) {
        carry = STATE.months[pk].carry + STATE.months[pk].income - STATE.months[pk].expense;
      }
      STATE.months[key] = { income: 0, expense: 0, carry, tx: [] };
    }
    return STATE.months[key];
  },
  _recalcTotals(m) {
    m.income = 0; m.expense = 0;
    m.tx.forEach(t => { if (t.type === 'income') m.income += t.amt; else m.expense += t.amt; });
  },
  addTransaction(desc, amt, type) {
    if (!Security.validateInput(desc, amt, type) || !Security.checkRateLimit()) return false;
    desc = Security.sanitizeInput(desc);
    const key = Formatter.getMonthKey();
    const m = this.getOrCreateMonth(key);
    m.tx.unshift({ desc, amt: Number(amt), type, ts: Date.now() });
    this._recalcTotals(m);
    return this.save();
  },
  updateTransaction(monthKey, idx, desc, amt, type) {
    if (!Security.validateInput(desc, amt, type) || !Security.checkRateLimit()) return false;
    desc = Security.sanitizeInput(desc);
    const m = STATE.months[monthKey];
    if (!m || !m.tx[idx]) return false;
    m.tx[idx] = { desc, amt: Number(amt), type, ts: Date.now() };
    this._recalcTotals(m);
    return this.save();
  },
  deleteTransaction(k, i) {
    if (!Security.checkRateLimit()) return false;
    const m = STATE.months[k];
    if (!m || !m.tx[i]) return false;
    m.tx.splice(i, 1);
    this._recalcTotals(m);
    return this.save();
  },
  refreshCarry(key) {
    const m = STATE.months[key];
    if (!m) return;
    const [y, mo] = key.split('-').map(Number);
    let py = y, pm = mo - 1;
    if (pm === 0) { pm = 12; py--; }
    const pk = `${py}-${String(pm).padStart(2, '0')}`;
    if (STATE.months[pk]) {
      const prev = STATE.months[pk];
      m.carry = prev.carry + prev.income - prev.expense;
    }
  },
  refreshAllCarries() {
    Object.keys(STATE.months).sort().forEach(key => this.refreshCarry(key));
  },
  showIndicator(msg) {
    const el = document.getElementById('indicator');
    if (!el) return;
    el.textContent = msg;
    el.className = 'indicator show';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2200);
  }
};

const ICONS = {

  del:  `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
  carry:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>`,
  cal:  `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,

};

const UI = {
  render() {
    clearTimeout(STATE.renderTimeout);
    STATE.renderTimeout = setTimeout(() => this._doRender(), 80);
  },
  _doRender() {
    const realCk = Formatter.getMonthKey();
    DataManager.refreshCarry(realCk);
    if (STATE.selectedMonth && STATE.selectedMonth !== realCk) {
      DataManager.refreshCarry(STATE.selectedMonth);
    }
    // Cascade-in only on first load and month switch, not on every save
    const enter = this._enter; this._enter = false;
    ['summary', 'months'].forEach(id => document.getElementById(id).classList.toggle('enter', enter));
    this.renderMonths();   // creates the current month if missing, so run before summary
    this.renderSummary();
    const editing = !!STATE.editing;
    document.getElementById('add-label').textContent = editing ? 'Save changes' : 'Add Transaction';
    document.getElementById('add').querySelector('svg').style.display = editing ? 'none' : '';
    document.getElementById('cancel-edit').hidden = !editing;
    document.getElementById('edit-badge').hidden = !editing;
    document.getElementById('form-title').textContent = editing ? 'Edit transaction' : 'New transaction';
    document.getElementById('tx-form').classList.toggle('editing', editing);
  },

  renderSummary() {
    const ck = STATE.selectedMonth || Formatter.getMonthKey();
    const cm = STATE.months[ck];
    if (!cm) { document.getElementById('summary').innerHTML = ''; return; }

    const { carry, income, expense } = cm;
    const balance = carry + income - expense;
    const balCls = balance < 0 ? 'balance-neg' : 'balance-card';
    const balSpan = carry === 0 ? ' full-width' : '';

    // sign: '+' / '-' fixed, 'auto' follows the value
    let i = 0;
    const card = (cls, label, key, v, sign) => `
      <div class="stat-card ${cls}" style="--i:${i++}">
        <div class="stat-label">${label}</div>
        <div class="stat-eur" data-count="${v}" data-key="${key}" data-sign="${sign}">${UI.money(v, sign)}</div>
        <div class="stat-bgn">≈ ${Formatter.convertToBGN(Math.abs(v))} BGN</div>
      </div>`;

    // Share of available money (income + positive carry) already spent
    const available = income + Math.max(carry, 0);
    const pct = available > 0 ? Math.min(100, Math.round(expense / available * 100)) : (expense > 0 ? 100 : 0);
    const ringColor = pct < 60 ? 'var(--income)' : pct < 85 ? 'var(--carry)' : 'var(--expense)';
    const spendHTML = (available > 0 || expense > 0) ? `
      <div class="spend-row" style="--i:4">
        <div class="ring-wrap" role="img" aria-label="${pct}% of available money spent">
          <svg class="ring-svg" viewBox="0 0 36 36" aria-hidden="true">
            <circle class="ring-track" cx="18" cy="18" r="15.915"/>
            <circle class="ring-fill" cx="18" cy="18" r="15.915" stroke="${ringColor}" style="stroke-dasharray:${this._lastPct ?? 0} 100" data-pct="${pct}"/>
          </svg>
          <span class="ring-label">${pct}%</span>
        </div>
        <div class="spend-info">
          <div class="spend-title">Spent of available</div>
          <div class="spend-text"><strong>${expense.toFixed(2)} €</strong> of <strong>${available.toFixed(2)} €</strong></div>
        </div>
      </div>` : '';

    const el = document.getElementById('summary');
    el.innerHTML = `
      <div class="summary-head">
        <h2 class="section-title">Summary</h2>
        <span class="summary-month">${Formatter.monthLabel(ck)}</span>
      </div>
      <div class="summary-panel">
        ${card(balCls + balSpan, 'Balance', 'bal', balance, 'auto')}
        ${card('income-card', 'Income', 'inc', income, '+')}
        ${card('expense-card', 'Spent', 'exp', expense, '-')}
        ${carry !== 0 ? card('carry-card', 'Carried Over', 'car', carry, 'auto') : ''}
        ${spendHTML}
      </div>`;

    this.animateNumbers(el);
    const ring = el.querySelector('.ring-fill');
    if (ring) setTimeout(() => { ring.style.strokeDasharray = `${pct} 100`; }, 30);
    this._lastPct = pct;
  },

  money(v, sign) {
    const s = sign === 'auto' ? (v < 0 ? '-' : '+') : sign;
    return `${s}${Math.abs(v).toFixed(2)} €`;
  },

  _prev: {},
  /* Count each figure up from its last shown value (or 0 on first load) */
  animateNumbers(root) {
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    root.querySelectorAll('[data-count]').forEach(el => {
      const to = parseFloat(el.dataset.count), key = el.dataset.key, sign = el.dataset.sign;
      const from = this._prev[key] ?? 0;
      this._prev[key] = to;
      if (still || from === to) { el.textContent = this.money(to, sign); return; }
      const t0 = performance.now(), dur = 900;
      const step = now => {
        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
        el.textContent = this.money(from + (to - from) * e, sign);
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  },

  renderMonths() {
    const c = document.getElementById('months');
    c.innerHTML = '';

    const realCk     = Formatter.getMonthKey();
    const displayKey = STATE.selectedMonth || realCk;
    const keys = Object.keys(STATE.months).sort().reverse();

    if (!keys.includes(realCk)) {
      DataManager.getOrCreateMonth(realCk);
      keys.unshift(realCk);
    }

    /* Month navigation */
    const nav = document.createElement('nav');
    nav.className = 'month-nav';
    nav.setAttribute('aria-label', 'Choose month');

    const curPill = document.createElement('button');
    curPill.className = `month-pill${displayKey === realCk ? ' active' : ''}`;
    curPill.textContent = Formatter.monthLabel(realCk);
    if (displayKey === realCk) curPill.setAttribute('aria-current', 'true');
    curPill.onclick = () => UI.switchMonth(realCk);
    nav.appendChild(curPill);

    if (displayKey !== realCk) {
      const sel = document.createElement('button');
      sel.className = 'month-pill active';
      sel.setAttribute('aria-current', 'true');
      sel.textContent = Formatter.monthLabel(displayKey);
      nav.appendChild(sel);
    }

    const byYear = {};
    keys.filter(k => k !== realCk).forEach(k => {
      const [y] = k.split('-');
      (byYear[y] = byYear[y] || []).push(k);
    });

    if (Object.keys(byYear).length > 0) {
      const wrap = document.createElement('div');
      wrap.className = 'prev-months-wrap';

      const btn = document.createElement('button');
      btn.className = 'prev-months-btn';
      btn.setAttribute('aria-haspopup', 'true');
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = `${ICONS.cal} Previous`;

      const dropdown = document.createElement('div');
      dropdown.className = 'prev-dropdown';
      _monthDropdownEl = dropdown;

      Object.keys(byYear).sort().reverse().forEach(year => {
        const grp = document.createElement('div');
        grp.className = 'prev-group';
        const title = document.createElement('div');
        title.className = 'prev-group-title';
        title.textContent = year;
        grp.appendChild(title);

        byYear[year].sort().reverse().forEach(mk => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = `prev-item${mk === displayKey ? ' active' : ''}`;
          item.textContent = MONTH_NAMES[parseInt(mk.split('-')[1]) - 1];
          item.onclick = () => { UI.switchMonth(mk); dropdown.classList.remove('show'); };
          grp.appendChild(item);
        });
        dropdown.appendChild(grp);
      });

      btn.onclick = (e) => {
        e.stopPropagation();
        const open = dropdown.classList.toggle('show');
        btn.setAttribute('aria-expanded', String(open));
      };
      wrap.appendChild(btn);
      wrap.appendChild(dropdown);
      nav.appendChild(wrap);
    } else {
      _monthDropdownEl = null;
    }

    c.appendChild(nav);

    /* Transaction card */
    const data = STATE.months[displayKey];
    if (!data) return;

    const card = document.createElement('div');
    card.className = 'month-card';

    if (data.carry !== 0) {
      const banner = document.createElement('div');
      banner.className = 'carry-banner';
      banner.innerHTML = `
        <div class="carry-left">${ICONS.carry}<span>Carried from previous month</span></div>
        <div class="carry-right">
          <div class="carry-eur">${data.carry >= 0 ? '+' : ''}${data.carry.toFixed(2)} €</div>
          <div class="carry-bgn">≈ ${Formatter.convertToBGN(Math.abs(data.carry))} BGN</div>
        </div>`;
      card.appendChild(banner);
    }

    const list = document.createElement('div');
    list.className = 'tx-list';

    if (data.tx.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `${ICONS.empty}No transactions this month<small>Add your first one with the form.</small>`;
      list.appendChild(empty);
    } else {
      data.tx.forEach((t, i) => {
        const row = document.createElement('div');
        row.className = `tx-row ${t.type}-row${i === 0 && this._flashNew && displayKey === realCk ? ' tx-new' : ''}`;
        row.style.setProperty('--i', i);
        const desc = this.esc(t.desc);
        row.innerHTML = `
          <div class="tx-main">
            <div class="tx-desc">${desc}</div>
            <div class="tx-meta">${Formatter.formatDate(t.ts)}</div>
          </div>
          <div class="tx-amount">
            <div class="tx-eur ${t.type}">${t.type === 'income' ? '+' : '-'}${Number(t.amt).toFixed(2)} €</div>
            <div class="tx-bgn">≈ ${Formatter.convertToBGN(t.amt)} BGN</div>
          </div>
          <div class="tx-actions">
            <button class="btn-action edit-btn" onclick="UI.startEdit('${displayKey}',${i})" title="Edit" aria-label="Edit ${desc}">${ICONS.edit}<span class="lbl">Edit</span></button>
            <button class="btn-action del-btn" onclick="UI.removeTx('${displayKey}',${i})" title="Delete" aria-label="Delete ${desc}">${ICONS.del}<span class="lbl">Delete</span></button>
          </div>`;
        list.appendChild(row);
      });
    }

    this._flashNew = false;
    card.appendChild(list);
    c.appendChild(card);
  },

  _enter: true,
  switchMonth(key) {
    STATE.selectedMonth = key;
    this._enter = true;
    this.render();
  },

  esc(text) {
    return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  },

  startEdit(monthKey, idx) {
    if (!Security.checkRateLimit()) return;
    const t = STATE.months[monthKey]?.tx[idx];
    if (!t) return;
    document.getElementById('desc').value   = t.desc;
    document.getElementById('amount').value = t.amt;
    document.getElementById('type').value   = t.type;
    this.updateTypeSelect(t.type);
    STATE.editing = { monthKey, idx };
    document.getElementById('tx-form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    document.getElementById('desc').focus({ preventScroll: true });
    this.render();
  },

  removeTx(k, i) {
    if (!confirm('Delete this transaction?')) return;
    if (DataManager.deleteTransaction(k, i)) { this.clearForm(); this.render(); }
  },

  clearForm() {
    document.getElementById('desc').value   = '';
    document.getElementById('amount').value = '';
    document.getElementById('type').value   = 'income';
    this.updateTypeSelect('income');
    STATE.editing = null;
  },

  updateTypeSelect(type) {
    document.querySelector('.seg').dataset.type = type;
    document.querySelectorAll('.seg-btn').forEach(b =>
      b.setAttribute('aria-checked', String(b.dataset.type === type)));
  },

  addTransaction() {
    const descEl = document.getElementById('desc');
    const amtEl  = document.getElementById('amount');
    const desc = descEl.value.trim();
    const amt  = amtEl.value;
    const type = document.getElementById('type').value;
    if (!desc) { descEl.focus(); DataManager.showIndicator('Enter a description'); return; }
    if (!amt)  { amtEl.focus();  DataManager.showIndicator('Enter an amount'); return; }
    const isNew = !STATE.editing;
    const ok = isNew
      ? DataManager.addTransaction(desc, amt, type)
      : DataManager.updateTransaction(STATE.editing.monthKey, STATE.editing.idx, desc, amt, type);
    if (ok) {
      // New entries always land in the current month, so show it and highlight the row
      if (isNew) { this._flashNew = true; if (STATE.selectedMonth) { STATE.selectedMonth = null; this._enter = true; } }
      this.clearForm(); this.render();
    }
  }
};

/* ════════════ THEME ════════════ */
const Theme = {
  init() {
    const stored = localStorage.getItem(CONFIG.THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    this.apply(stored || (prefersDark ? 'dark' : 'light'));

    document.getElementById('theme-toggle').addEventListener('click', () => this.toggle());
    document.getElementById('auto-theme-btn').addEventListener('click', () => this.toggleAuto());
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem(CONFIG.THEME_KEY)) { this.apply(e.matches ? 'dark' : 'light'); this.updateAutoBtn(); }
    });
    this.updateAutoBtn();
  },
  apply(theme) {
    document.body.setAttribute('data-theme', theme);
    this.updateToggleIcon(theme);
  },
  toggle() {
    const next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem(CONFIG.THEME_KEY, next);
    this.apply(next);
    this.updateAutoBtn();
  },
  isAuto() { return !localStorage.getItem(CONFIG.THEME_KEY); },
  toggleAuto() {
    if (this.isAuto()) {
      localStorage.setItem(CONFIG.THEME_KEY, document.body.getAttribute('data-theme'));
    } else {
      localStorage.removeItem(CONFIG.THEME_KEY);
      this.apply(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    this.updateAutoBtn();
  },
  updateAutoBtn() {
    const btn = document.getElementById('auto-theme-btn');
    if (!btn) return;
    const auto = this.isAuto();
    btn.classList.toggle('auto-active', auto);
    btn.setAttribute('aria-pressed', String(auto));
    btn.title = auto ? 'Auto theme ON — follows your device (click to disable)' : 'Auto theme OFF — click to follow device theme';
  },
  updateToggleIcon(theme) {
    const btn = document.getElementById('theme-toggle');
    btn.innerHTML = theme === 'dark'
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
  }
};

/* ════════════ FILE MANAGER (unchanged format) ════════════ */
const FileManager = {
  exportToTxt() {
    try {
      DataManager.refreshAllCarries();
      let txt = 'SALARY TRACKER BACKUP - ' + new Date().toLocaleString() + '\n';
      txt += '='.repeat(50) + '\n\n';

      Object.keys(STATE.months).sort().forEach(mk => {
        const m   = STATE.months[mk];
        const fin = m.carry + m.income - m.expense;
        txt += `MONTH: ${mk}\n`;
        txt += '-'.repeat(40) + '\n';
        txt += `Carry from previous: ${m.carry.toFixed(2)} €\n`;
        txt += `Total Income: ${m.income.toFixed(2)} €\n`;
        txt += `Total Expense: ${m.expense.toFixed(2)} €\n`;
        txt += `Final Balance: ${fin.toFixed(2)} € (≈ ${Formatter.convertToBGN(fin)} BGN)\n\n`;
        txt += 'TRANSACTIONS:\n';
        if (m.tx.length === 0) {
          txt += '  (No transactions)\n';
        } else {
          m.tx.forEach(t => {
            const bgn  = Formatter.convertToBGN(t.amt);
            const sign = t.type === 'income' ? '+' : '-';
            txt += `  [${Formatter.formatDate(t.ts)}|${t.ts}] ${sign}${t.amt.toFixed(2)} € (≈ ${bgn} BGN) - ${t.type.toUpperCase()} - ${t.desc}\n`;
          });
        }
        txt += '\n' + '='.repeat(50) + '\n\n';
      });

      const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `myBalance - ${Formatter.filenameDateStamp()}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
      DataManager.showIndicator('✓ Exported successfully');
    } catch (e) {
      DataManager.showIndicator('✕ Export failed');
    }
    Menu.close();
  },

  importFromTxt(file) {
    try {
      const reader = new FileReader();
      reader.onload = e => {
        const imported = this.parseTxt(e.target.result);
        if (!imported || Object.keys(imported).length === 0) {
          DataManager.showIndicator('✕ Invalid file format');
          return;
        }
        const replace = confirm('Replace all data with imported data?\n\nOK = Replace\nCancel = Merge');
        if (replace) {
          STATE.months = imported;
        } else {
          Object.keys(imported).forEach(mk => {
            const imp = imported[mk];
            const ex  = STATE.months[mk];
            if (!ex) {
              STATE.months[mk] = imp;
            } else {
              imp.tx.forEach(it => {
                const dup = ex.tx.some(et => et.ts === it.ts && et.amt === it.amt && et.type === it.type && et.desc === it.desc);
                if (!dup) ex.tx.unshift(it);
              });
            }
          });
        }
        Object.values(STATE.months).forEach(m => DataManager._recalcTotals(m));
        DataManager.refreshAllCarries();
        DataManager.save();
        UI.render();
        DataManager.showIndicator('✓ Imported successfully');
      };
      reader.readAsText(file);
    } catch {
      DataManager.showIndicator('✕ Import failed');
    }
  },

  parseTxt(content) {
    try {
      const lines = content.split('\n');
      const data  = {};
      let cur = null, txs = [], md = { income: 0, expense: 0, carry: 0 };

      for (const raw of lines) {
        const line = raw.trim();
        if (line.startsWith('MONTH:')) {
          if (cur) data[cur] = { ...md, tx: txs };
          cur = line.replace('MONTH:', '').trim();
          txs = []; md = { income: 0, expense: 0, carry: 0 };
        } else if (line.startsWith('Carry from previous:')) {
          const m = line.match(/([-]?\d+\.?\d*)/); if (m) md.carry = parseFloat(m[1]);
        } else if (line.startsWith('Total Income:')) {
          const m = line.match(/([-]?\d+\.?\d*)/); if (m) md.income = parseFloat(m[1]);
        } else if (line.startsWith('Total Expense:')) {
          const m = line.match(/([-]?\d+\.?\d*)/); if (m) md.expense = parseFloat(m[1]);
        } else if (line.startsWith('[') && cur) {
          const m = line.match(/\[(.*?)\|(\d+)\]\s*([\+\-])(\d+\.?\d*)\s*€.*?-\s*(INCOME|EXPENSE)\s*-\s*(.*)/i);
          if (m) {
            const ts = parseInt(m[2]);
            if (!isNaN(ts)) txs.push({ desc: m[6].trim(), amt: parseFloat(m[4]), type: m[5].toLowerCase(), ts });
          }
        }
      }
      if (cur) data[cur] = { ...md, tx: txs };
      return data;
    } catch { return null; }
  }
};

/* ════════════ EVENTS ════════════ */
const Menu = {
  el: document.getElementById('menu-dropdown'),
  btn: document.getElementById('menu-btn'),
  toggle() { const open = this.el.classList.toggle('show'); this.btn.setAttribute('aria-expanded', String(open)); },
  close()  { this.el.classList.remove('show'); this.btn.setAttribute('aria-expanded', 'false'); }
};

document.getElementById('add').addEventListener('click', () => UI.addTransaction());
document.getElementById('cancel-edit').addEventListener('click', () => { UI.clearForm(); UI.render(); });
document.getElementById('desc').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('amount').focus(); }
});
document.getElementById('amount').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); UI.addTransaction(); }
});
document.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => {
  document.getElementById('type').value = b.dataset.type;
  UI.updateTypeSelect(b.dataset.type);
}));
Menu.btn.addEventListener('click', () => Menu.toggle());
document.addEventListener('click', e => {
  if (!e.target.closest('.menu-container')) Menu.close();
  if (_monthDropdownEl && !e.target.closest('.prev-months-wrap')) _monthDropdownEl.classList.remove('show');
});
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) FileManager.importFromTxt(e.target.files[0]);
  e.target.value = '';
  Menu.close();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  Menu.close();
  if (_monthDropdownEl) _monthDropdownEl.classList.remove('show');
  if (STATE.editing) { UI.clearForm(); UI.render(); }
});

/* ════════════ GUIDE TOUR ════════════ */
const Guide = {
  SEEN_KEY: 'salary-tracker-guide-seen',
  STEPS: [
    { sel: '.app-header', title: 'Welcome to myBalance €', body: 'Your personal finance tracker. Everything is stored locally in your browser — no account, no server, no data leaves your device.' },
    { sel: '.form-card',  title: 'Add a Transaction',      body: 'Type a description, enter an amount, pick Income or Expense, then tap Add. You can edit or delete any entry later.' },
    { sel: '#summary',    title: 'Monthly Summary',        body: 'See your Balance, Income, Spent, Carried Over (rolled from previous months) and how much of your money is already spent — in EUR and BGN.' },
    { sel: '#months',     title: 'Transactions & Months',  body: 'Entries are grouped by month. Switch months with the pills above the list. Use the pencil to edit or the bin to delete.' },
    { sel: '#menu-btn',   title: 'Backup Your Data',       body: 'Use the ⋮ menu to download a .txt backup of all your data, or upload one to restore or merge it back in.' }
  ],
  _step: 0,
  init() {
    document.getElementById('guide-btn').addEventListener('click', () => this.start());
    document.getElementById('guide-next').addEventListener('click', () => this.next());
    document.getElementById('guide-skip').addEventListener('click', () => this.finish());
    window.addEventListener('resize', () => { if (this._open) this._show(this._step); });
    if (!localStorage.getItem(this.SEEN_KEY)) setTimeout(() => this.start(), 600);
  },
  start() { this._step = 0; this._open = true; this._show(0); },
  _show(n) {
    const step = this.STEPS[n];
    const target = document.querySelector(step.sel);
    document.getElementById('guide-title').textContent   = step.title;
    document.getElementById('guide-body').textContent    = step.body;
    document.getElementById('guide-counter').textContent = `${n + 1} / ${this.STEPS.length}`;
    document.getElementById('guide-next').textContent    = n === this.STEPS.length - 1 ? 'Finish' : 'Next';

    const hl = document.getElementById('guide-highlight');
    const tt = document.getElementById('guide-tooltip');
    hl.style.display = 'block';
    tt.style.display = 'block';
    document.getElementById('guide-next').focus();
    if (!target) return;

    target.scrollIntoView({ block: 'nearest' });
    requestAnimationFrame(() => {
      const r = target.getBoundingClientRect();
      const pad = 6;
      Object.assign(hl.style, { left: `${r.left - pad}px`, top: `${r.top - pad}px`, width: `${r.width + pad * 2}px`, height: `${r.height + pad * 2}px` });

      const vw = window.innerWidth, vh = window.innerHeight;
      const maxW = Math.min(340, vw - 32);
      const th = tt.offsetHeight || 170;
      let top  = r.bottom + pad + 12;
      let left = r.left;
      if (top + th > vh - 16) top = r.top - pad - 12 - th;
      if (top < 16) top = Math.max(16, vh - th - 16);   // target taller than viewport: pin to bottom
      if (left + maxW > vw - 16) left = vw - maxW - 16;
      if (left < 16) left = 16;
      Object.assign(tt.style, { top: `${top}px`, left: `${left}px`, maxWidth: `${maxW}px` });
    });
  },
  next() { this._step++; this._step >= this.STEPS.length ? this.finish() : this._show(this._step); },
  finish() {
    this._open = false;
    document.getElementById('guide-highlight').style.display = 'none';
    document.getElementById('guide-tooltip').style.display   = 'none';
    localStorage.setItem(this.SEEN_KEY, '1');
  }
};

/* ════════════ BOOT ════════════ */
Theme.init();
UI.updateTypeSelect('income');
UI.render();
Guide.init();

/* Live clock — shorter on phones */
(function tick() {
  const el = document.getElementById('live-date');
  if (el) {
    const now = new Date();
    const full  = now.toLocaleString('en-GB', { weekday:'short', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false });
    const short = now.toLocaleString('en-GB', { hour:'2-digit', minute:'2-digit', hour12: false });
    el.innerHTML = `<span class="full">${full}</span><span class="short">${short}</span>`;
  }
  setTimeout(tick, 1000);
})();
</script>
