<script>
/* ════════════ CONFIG ════════════ */
const CONFIG = {
  STORAGE_KEY: 'salary-tracker-monthly-v3',
  THEME_KEY: 'salary-tracker-theme',
  EUR_TO_BGN: 1.95583,
  MAX_DESC_LENGTH: 100,
  MAX_AMOUNT: 999999.99,
  MIN_AMOUNT: 0.01,
  RATE_LIMIT_MS: 300,
};
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = id => document.getElementById(id);
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = p => { try { if (navigator.vibrate && navigator.userActivation?.hasBeenActive !== false) navigator.vibrate(p); } catch {} };

const STATE = {
  months: (() => { try { return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || '{}') || {}; } catch { return {}; } })(),
  editing: null,
  query: '',
  day: '',
  selectedMonth: null,
  lastActionTime: Date.now(),
  renderTimeout: null
};

/* ════════════ SECURITY ════════════ */
const Security = {
  checkRateLimit() {
    const now = Date.now();
    if (now - STATE.lastActionTime < CONFIG.RATE_LIMIT_MS) return false;
    STATE.lastActionTime = now;
    return true;
  },
  validateInput(desc, amt, type) {
    if (!desc || typeof desc !== 'string') return false;
    if (desc.trim().length === 0 || desc.length > CONFIG.MAX_DESC_LENGTH) return false;
    const amount = Number(amt);
    if (isNaN(amount) || amount < CONFIG.MIN_AMOUNT || amount > CONFIG.MAX_AMOUNT) return false;
    if (!['income', 'expense'].includes(type)) return false;
    return true;
  },
  sanitizeInput(str) {
    if (typeof str !== 'string') return '';
    return str.slice(0, CONFIG.MAX_DESC_LENGTH).replace(/[<>]/g, '').trim();
  }
};

/* ════════════ FORMATTER ════════════ */
const Formatter = {
  getMonthKey(d = new Date()) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  },
  monthLabel(key) {
    const [y, m] = key.split('-');
    return `${MONTH_NAMES[parseInt(m) - 1]} ${y}`;
  },
  formatDate(timestamp) {
    try {
      const d = new Date(timestamp);
      const dd  = String(d.getDate()).padStart(2, '0');
      const mm  = String(d.getMonth() + 1).padStart(2, '0');
      const yy  = String(d.getFullYear()).slice(-2);
      const hh  = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${dd}.${mm}.${yy} | ${hh}:${min}`;
    } catch { return 'Invalid Date'; }
  },
  time(ts) {
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  },
  dayLabel(ts) {
    const d = new Date(ts), now = new Date();
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    if (d.toDateString() === now.toDateString())  return 'Today';
    if (d.toDateString() === yest.toDateString()) return 'Yesterday';
    const opts = { weekday: 'short', day: 'numeric', month: 'short' };
    if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString('en-GB', opts);
  },
  convertToBGN(eur) {
    return (eur * CONFIG.EUR_TO_BGN).toFixed(2);
  },
  /* 1234.5 → "1 234.50" (display only; backups keep plain numbers) */
  num(n) {
    return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  },
  parseAmount(str) {
    // phones in many locales type a comma as the decimal separator
    return Number(String(str).replace(/\s/g, '').replace(',', '.'));
  },
  filenameDateStamp() {
    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${p(now.getDate())}.${p(now.getMonth() + 1)}.${String(now.getFullYear()).slice(-2)} - ${p(now.getHours())}.${p(now.getMinutes())}.${p(now.getSeconds())}`;
  }
};

/* ════════════ DATA MANAGER ════════════ */
const DataManager = {
  save() {
    try {
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STATE.months));
      return true;
    } catch (e) {
      this.showIndicator('✕ Save failed');
      return false;
    }
  },
  getOrCreateMonth(key) {
    if (!STATE.months[key]) {
      let carry = 0;
      const [y, m] = key.split('-').map(Number);
      let py = y, pm = m - 1;
      if (pm === 0) { pm = 12; py--; }
      const pk = `${py}-${String(pm).padStart(2, '0')}`;
      if (STATE.months[pk]) {
        carry = STATE.months[pk].carry + STATE.months[pk].income - STATE.months[pk].expense;
      }
      STATE.months[key] = { income: 0, expense: 0, carry, tx: [] };
    }
    return STATE.months[key];
  },
  _recalcTotals(m) {
    m.income = 0; m.expense = 0;
    m.tx.forEach(t => { if (t.type === 'income') m.income += t.amt; else m.expense += t.amt; });
  },
  addTransaction(desc, amt, type) {
    if (!Security.validateInput(desc, amt, type) || !Security.checkRateLimit()) return false;
    desc = Security.sanitizeInput(desc);
    const key = Formatter.getMonthKey();
    const m = this.getOrCreateMonth(key);
    m.tx.unshift({ desc, amt: Number(amt), type, ts: Date.now() });
    this._recalcTotals(m);
    return this.save();
  },
  updateTransaction(monthKey, idx, desc, amt, type) {
    if (!Security.validateInput(desc, amt, type) || !Security.checkRateLimit()) return false;
    desc = Security.sanitizeInput(desc);
    const m = STATE.months[monthKey];
    if (!m || !m.tx[idx]) return false;
    // keep the original date so the entry stays on its day
    m.tx[idx] = { desc, amt: Number(amt), type, ts: m.tx[idx].ts };
    this._recalcTotals(m);
    return this.save();
  },
  deleteTransaction(k, i) {
    if (!Security.checkRateLimit()) return false;
    const m = STATE.months[k];
    if (!m || !m.tx[i]) return false;
    m.tx.splice(i, 1);
    this._recalcTotals(m);
    return this.save();
  },
  refreshCarry(key) {
    const m = STATE.months[key];
    if (!m) return;
    const [y, mo] = key.split('-').map(Number);
    let py = y, pm = mo - 1;
    if (pm === 0) { pm = 12; py--; }
    const pk = `${py}-${String(pm).padStart(2, '0')}`;
    if (STATE.months[pk]) {
      const prev = STATE.months[pk];
      m.carry = prev.carry + prev.income - prev.expense;
    }
  },
  refreshAllCarries() {
    Object.keys(STATE.months).sort().forEach(key => this.refreshCarry(key));
  },
  /* action: optional { label, fn } button, e.g. Undo */
  showIndicator(msg, action) {
    const el = $('indicator');
    if (!el) return;
    el.textContent = '';
    const s = document.createElement('span');
    s.textContent = msg;
    el.append(s);
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = action.label;
      b.onclick = () => { el.classList.remove('show'); action.fn(); };
      el.append(b);
    }
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), action ? 5000 : 2200);
  }
};

/* ════════════ ICONS ════════════ */
const ICONS = {
  up:   `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>`,
  down: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M16 17H7V8"/></svg>`,
  carry:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>`,
  cal:  `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
  trash:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  search:`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
  plus: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  empty:`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>`
};

/* ════════════ UI ════════════ */
const UI = {
  _enter: true, _dir: 0, _flashTs: null, _prev: {}, _lastPct: 0, _navInit: false,
  _lastType: 'expense',

  render() {
    clearTimeout(STATE.renderTimeout);
    STATE.renderTimeout = setTimeout(() => this._doRender(), 60);
  },
  _doRender() {
    const realCk = Formatter.getMonthKey();
    DataManager.getOrCreateMonth(realCk);
    DataManager.refreshCarry(realCk);
    if (STATE.selectedMonth && STATE.selectedMonth !== realCk) DataManager.refreshCarry(STATE.selectedMonth);
    // Cascade on first load, slide on month switch, nothing on a plain save
    const anim = this._dir ? (this._dir > 0 ? 'slide-next' : 'slide-prev') : (this._enter ? 'enter' : '');
    this._enter = false; this._dir = 0;
    ['summary', 'list'].forEach(id => { $(id).className = anim; });
    this.renderNav();
    this.renderSummary();
    this.renderList();
  },

  current() { return STATE.selectedMonth || Formatter.getMonthKey(); },

  renderNav() {
    const nav = $('months-nav'), realCk = Formatter.getMonthKey(), sel = this.current();
    nav.innerHTML = Object.keys(STATE.months).sort().map(k => {
      const [y, m] = k.split('-'), on = k === sel, now = k === realCk;
      return `<button type="button" class="mchip${on ? ' active' : ''}${now ? ' now' : ''}" data-k="${this.esc(k)}"${on ? ' aria-current="true"' : ''} aria-label="${this.esc(Formatter.monthLabel(k))}"><b>${MONTH_NAMES[parseInt(m) - 1] || '?'}</b><small>${now ? 'Now' : this.esc(y)}</small></button>`;
    }).join('');
    const act = nav.querySelector('.active');
    if (act) requestAnimationFrame(() => nav.scrollTo({
      left: act.offsetLeft - (nav.clientWidth - act.offsetWidth) / 2,
      behavior: this._navInit && !still() ? 'smooth' : 'auto'
    }));
    this._navInit = true;
  },

  renderSummary() {
    const ck = this.current(), cm = STATE.months[ck], el = $('summary');
    if (!cm) { el.innerHTML = ''; return; }
    const { carry, income, expense } = cm;
    const balance = carry + income - expense;

    // Share of available money (income + positive carry) already spent
    const available = income + Math.max(carry, 0);
    const pct = available > 0 ? Math.min(100, Math.round(expense / available * 100)) : (expense > 0 ? 100 : 0);
    const level = pct < 60 ? 'ok' : pct < 85 ? 'warn' : 'high';

    let i = 0;
    const stat = (cls, label, key, v, sign, icon) => `
      <div class="stat ${cls}" style="--i:${++i}">
        <span class="stat-ico">${icon}</span>
        <div class="stat-txt">
          <div class="stat-label">${label}</div>
          <div class="stat-val" data-count="${v}" data-key="${key}" data-sign="${sign}">${this.money(v, sign)}</div>
          <div class="stat-bgn">≈ ${Formatter.convertToBGN(Math.abs(v))} BGN</div>
        </div>
      </div>`;

    const meter = (available > 0 || expense > 0) ? `
      <div class="meter ${level}" role="progressbar" aria-label="Spent of available money" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">
        <span class="meter-fill" style="transform:scaleX(${this._lastPct / 100})"></span>
      </div>
      <div class="meter-text"><span><b>${pct}%</b> spent</span><span>${Formatter.num(expense)} € of ${Formatter.num(available)} €</span></div>`
      : `<div class="meter-text muted">No activity this month yet</div>`;

    el.innerHTML = `
      <div class="hero${balance < 0 ? ' neg' : ''}">
        <div class="hero-top">
          <span class="hero-label">Balance</span>
          <span class="hero-month">${ICONS.cal}${this.esc(Formatter.monthLabel(ck))}</span>
        </div>
        <div class="hero-amount" data-count="${balance}" data-key="bal" data-sign="auto" data-big="1">${this.moneyBig(balance)}</div>
        <div class="hero-bgn">≈ ${Formatter.convertToBGN(Math.abs(balance))} BGN</div>
        ${meter}
      </div>
      <div class="stats${carry !== 0 ? ' three' : ''}">
        ${stat('income', 'Income', 'inc', income, '+', ICONS.up)}
        ${stat('expense', 'Spent', 'exp', expense, '-', ICONS.down)}
        ${carry !== 0 ? stat('carry', 'Carried over', 'car', carry, 'auto', ICONS.carry) : ''}
      </div>`;

    this.animateNumbers(el);
    const fill = el.querySelector('.meter-fill');
    if (fill) setTimeout(() => { fill.style.transform = `scaleX(${pct / 100})`; }, 40);
    this._lastPct = pct;

    const mini = $('mini-bal');
    mini.textContent = `Balance ${this.money(balance, 'auto')}`;
    mini.classList.toggle('neg', balance < 0);
  },

  money(v, sign) {
    if (Math.abs(v) < 0.005) return `${Formatter.num(0)} €`;   // no "+0.00" / "−0.00"
    const s = sign === 'auto' ? (v < 0 ? '−' : '+') : (sign === '-' ? '−' : sign);
    return `${s}${Formatter.num(v)} €`;
  },
  moneyBig(v) {
    const [int, dec] = Formatter.num(v).split('.');
    return `${v < 0 ? '−' : ''}${int}<span class="cents">.${dec}</span><span class="cur"> €</span>`;
  },

  /* Count each figure up from its last shown value (or 0 on first load) */
  animateNumbers(root) {
    root.querySelectorAll('[data-count]').forEach(el => {
      const to = parseFloat(el.dataset.count), key = el.dataset.key, sign = el.dataset.sign;
      const from = this._prev[key] ?? 0;
      this._prev[key] = to;
      const paint = v => { if (el.dataset.big) el.innerHTML = this.moneyBig(v); else el.textContent = this.money(v, sign); };
      if (still() || from === to) { paint(to); return; }
      const t0 = performance.now(), dur = 900;
      const step = now => {
        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
        paint(from + (to - from) * e);
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  },

  /* local calendar day of a timestamp, e.g. "2026-11-04" */
  dayKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },
  matches(t, q) {
    if (!q) return true;
    return t.desc.toLowerCase().includes(q) || t.amt.toFixed(2).includes(q.replace(',', '.'));
  },
  /* filter change: redraw only the list, with a quick fade instead of the full cascade */
  refreshList() {
    $('list').className = still() ? '' : 'filtering';
    this.renderList();
  },
  clearFilters() {
    STATE.query = ''; STATE.day = '';
    $('search').value = '';
    $('search-clear').hidden = true;
  },

  renderList() {
    const c = $('list'), realCk = Formatter.getMonthKey(), key = this.current();
    const data = STATE.months[key];
    if (!data) { c.innerHTML = ''; return; }
    const k = this.esc(key);
    const q = STATE.query.trim().toLowerCase(), day = STATE.day;
    const filtering = !!(q || day);

    // newest first; keep the real index for edit/delete
    const order = data.tx.map((_, i) => i).sort((a, b) => data.tx[b].ts - data.tx[a].ts);
    const shown = order.filter(i => (!day || this.dayKey(data.tx[i].ts) === day) && this.matches(data.tx[i], q));
    $('tx-count').textContent = filtering ? `${shown.length}/${data.tx.length}` : data.tx.length;

    let html = '';
    // day filter: one chip per day that has entries
    const days = [...new Set(order.map(i => this.dayKey(data.tx[i].ts)))];
    if (days.length > 1 || day) {
      html += `<div class="days" role="group" aria-label="Filter by day">
        <button type="button" class="dchip${day ? '' : ' active'}" data-day="" aria-pressed="${!day}"><b>All</b><small>days</small></button>
        ${days.map(d => {
          const dt = new Date(d + 'T12:00');
          return `<button type="button" class="dchip${d === day ? ' active' : ''}" data-day="${d}" aria-pressed="${d === day}" aria-label="${dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}"><b>${dt.getDate()}</b><small>${dt.toLocaleDateString('en-GB', { weekday: 'short' })}</small></button>`;
        }).join('')}</div>`;
    }

    if (filtering) {
      const net = shown.reduce((s, i) => s + (data.tx[i].type === 'income' ? 1 : -1) * data.tx[i].amt, 0);
      html += `<div class="results"><span><b>${shown.length}</b> found · ${this.money(net, 'auto')}</span><button type="button" class="link-btn" data-action="clear">Clear filters</button></div>`;
    } else if (data.carry !== 0) {
      html += `
      <div class="carry-banner">${ICONS.carry}<span class="ttl">Carried from previous month</span>
        <span class="amt">${this.money(data.carry, 'auto')}<small>≈ ${Formatter.convertToBGN(Math.abs(data.carry))} BGN</small></span></div>`;
    }

    if (data.tx.length === 0) {
      html += `<div class="empty"><div class="empty-art">${ICONS.empty}</div>
        <b>No transactions in ${this.esc(Formatter.monthLabel(key))}</b>
        <p>${key === realCk ? 'Your income and expenses will show up here.' : 'Nothing was recorded this month.'}</p>
        ${key === realCk ? `<button type="button" class="btn-primary" data-action="add">${ICONS.plus}Add the first one</button>` : ''}
      </div>`;
    } else if (shown.length === 0) {
      // no match here: offer other months that do match the search
      const other = q ? Object.keys(STATE.months).sort().reverse()
        .filter(mk => mk !== key)
        .map(mk => [mk, STATE.months[mk].tx.filter(t => this.matches(t, q)).length])
        .filter(([, n]) => n) : [];
      html += `<div class="empty"><div class="empty-art">${ICONS.search}</div>
        <b>No matches${day ? ' on this day' : ''}</b>
        <p>${other.length ? 'Found in other months:' : 'Try another word, amount or day.'}</p>
        ${other.length ? `<div class="elsewhere">${other.map(([mk, n]) => `<button type="button" class="link-btn" data-goto="${this.esc(mk)}">${this.esc(Formatter.monthLabel(mk))} · ${n}</button>`).join('')}</div>` : ''}
      </div>`;
    } else {
      const groups = [];
      shown.forEach(i => {
        const d = this.dayKey(data.tx[i].ts), g = groups[groups.length - 1];
        if (g && g.day === d) g.items.push(i); else groups.push({ day: d, items: [i] });
      });
      groups.forEach((g, gi) => {
        const net = g.items.reduce((s, i) => s + (data.tx[i].type === 'income' ? 1 : -1) * data.tx[i].amt, 0);
        html += `<section class="tx-day" style="--i:${gi}">
          <h3 class="day-label">${Formatter.dayLabel(data.tx[g.items[0]].ts)}<span>${this.money(net, 'auto')}</span></h3>
          <div class="tx-group">`;
        g.items.forEach(i => {
          const t = data.tx[i], desc = this.esc(t.desc), sign = t.type === 'income' ? '+' : '−';
          html += `<div class="tx-item"><div class="tx-del-bg" aria-hidden="true">${ICONS.trash}Delete</div><button type="button" class="tx-row ${t.type}${t.ts === this._flashTs ? ' tx-new' : ''}" data-k="${k}" data-i="${i}" aria-label="${desc}, ${sign}${t.amt.toFixed(2)} euro. Open to edit or delete">
            <span class="tx-ico">${t.type === 'income' ? ICONS.up : ICONS.down}</span>
            <span class="tx-main"><span class="tx-desc">${desc}</span><span class="tx-meta">${Formatter.time(t.ts)}</span></span>
            <span class="tx-amount"><span class="tx-eur">${sign}${Formatter.num(t.amt)} €</span><span class="tx-bgn">≈ ${Formatter.convertToBGN(t.amt)} BGN</span></span>
          </button></div>`;
        });
        html += `</div></section>`;
      });
    }
    c.innerHTML = html;
    this._flashTs = null;
    const act = c.querySelector('.dchip.active');
    if (act && day) act.scrollIntoView({ block: 'nearest', inline: 'center' });
  },

  switchMonth(key) {
    const cur = this.current();
    if (key === cur) return;
    this._dir = key > cur ? 1 : -1;
    STATE.day = '';   // a day belongs to one month; the search text stays
    STATE.selectedMonth = key === Formatter.getMonthKey() ? null : key;
    buzz(6);
    this.render();
  },
  /* d = +1 newer, -1 older; nudge the card when there is nothing further */
  stepMonth(d) {
    const keys = Object.keys(STATE.months).sort();
    const next = keys[keys.indexOf(this.current()) + d];
    if (next) return this.switchMonth(next);
    const hero = document.querySelector('.hero');
    if (hero && !still()) { hero.classList.remove('nudge-l', 'nudge-r'); void hero.offsetWidth; hero.classList.add(d > 0 ? 'nudge-l' : 'nudge-r'); }
  },

  esc(text) {
    return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  },

  /* ── form sheet ── */
  openNew() {
    this.clearForm();
    this.syncForm();
    Sheet.open($('tx-sheet'));
    // keyboard only pops up by itself on desktop; on phones the user taps the amount
    if (matchMedia('(pointer: fine)').matches) $('amount').focus();
  },
  startEdit(monthKey, idx) {
    const t = STATE.months[monthKey]?.tx[idx];
    if (!t) return;
    $('desc').value = t.desc;
    $('amount').value = t.amt.toFixed(2);
    this.updateTypeSelect(t.type);
    STATE.editing = { monthKey, idx };
    this.syncForm();
    Sheet.open($('tx-sheet'));
  },
  /* tap on an entry: show it with Edit / Delete */
  openActions(k, i) {
    const t = STATE.months[k]?.tx[i];
    if (!t) return;
    this._act = { k, i };
    const sign = t.type === 'income' ? '+' : '−';
    $('act-card').className = `act-card ${t.type}`;
    $('act-ico').innerHTML = t.type === 'income' ? ICONS.up : ICONS.down;
    $('act-desc').textContent = t.desc;
    $('act-date').textContent = new Date(t.ts).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    $('act-amt').innerHTML = `${sign}${Formatter.num(t.amt)} €<small>≈ ${Formatter.convertToBGN(t.amt)} BGN</small>`;
    Sheet.open($('act-sheet'));
  },
  /* ask first; on "no" the swiped row springs back */
  async confirmDelete(k, i) {
    const t = STATE.months[k]?.tx[i];
    if (!t) return;
    const ok = await Confirm.ask(`"${t.desc}" (${t.type === 'income' ? '+' : '−'}${Formatter.num(t.amt)} €) will be removed. You can undo right after.`);
    if (ok) return this.removeTx(k, i);
    const item = this.itemEl(k, i);
    if (item) { item.classList.remove('armed'); item.querySelector('.tx-row').style.transform = ''; }
  },
  itemEl(k, i) {
    return document.querySelector(`.tx-row[data-k="${CSS.escape(k)}"][data-i="${i}"]`)?.closest('.tx-item');
  },
  syncForm() {
    const editing = !!STATE.editing;
    $('form-title').textContent = editing ? 'Edit transaction' : 'New transaction';
    $('add-label').textContent = editing ? 'Save changes' : 'Add transaction';
    $('form-error').textContent = '';
    this.onAmountInput();
    this.renderSuggest();
  },
  clearForm() {
    $('desc').value = '';
    $('amount').value = '';
    this.updateTypeSelect(this._lastType);
    STATE.editing = null;
  },
  updateTypeSelect(type) {
    $('type').value = type;
    $('type-seg').dataset.type = type;
    $('tx-form').dataset.type = type;
    document.querySelectorAll('#type-seg .seg-btn').forEach(b => b.setAttribute('aria-checked', String(b.dataset.type === type)));
  },
  onAmountInput() {
    const el = $('amount');
    const clean = el.value.replace(/[^\d.,]/g, '');
    if (clean !== el.value) el.value = clean;
    el.style.width = Math.max(4.5, clean.length + 0.5) + 'ch';
    const v = Formatter.parseAmount(clean);
    $('amount-bgn').textContent = `≈ ${Formatter.convertToBGN(isNaN(v) ? 0 : v)} BGN`;
  },
  /* recent descriptions of the chosen type as one-tap chips */
  renderSuggest() {
    const type = $('type').value, seen = new Set(), out = [];
    Object.keys(STATE.months).sort().reverse().forEach(k => STATE.months[k].tx.forEach(t => {
      const key = t.desc.toLowerCase();
      if (t.type !== type || out.length >= 8 || seen.has(key)) return;
      seen.add(key); out.push(t.desc);
    }));
    const box = $('suggest');
    box.innerHTML = out.map((d, i) => `<button type="button" class="chip" style="--i:${i}">${this.esc(d)}</button>`).join('');
    box.hidden = !out.length;
  },
  fail(fieldId, msg) {
    const f = $(fieldId);
    $('form-error').textContent = msg;
    f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    f.querySelector('input').focus();
    buzz([12, 50, 12]);
  },

  addTransaction() {
    const desc = $('desc').value.trim();
    const amt  = Formatter.parseAmount($('amount').value);
    const type = $('type').value;
    if (!(amt > 0)) return this.fail('amount-field', 'Enter an amount');
    if (amt > CONFIG.MAX_AMOUNT) return this.fail('amount-field', 'Amount is too large');
    if (!desc) return this.fail('desc-field', 'Add a short description');
    const isNew = !STATE.editing;
    const ok = isNew
      ? DataManager.addTransaction(desc, amt, type)
      : DataManager.updateTransaction(STATE.editing.monthKey, STATE.editing.idx, desc, amt, type);
    if (!ok) { $('form-error').textContent = 'Could not save — try again'; return; }

    const k = isNew ? Formatter.getMonthKey() : STATE.editing.monthKey;
    this._flashTs = (isNew ? STATE.months[k].tx[0] : STATE.months[k].tx[STATE.editing.idx]).ts;
    this._lastType = type;
    // New entries always land in the current month, so jump there
    if (isNew && STATE.selectedMonth) { STATE.selectedMonth = null; this._dir = 1; }
    if (isNew) this.clearFilters();
    STATE.editing = null;
    buzz(14);
    Sheet.close($('tx-sheet'));
    this.render();
    DataManager.showIndicator(isNew ? `Added ${type === 'income' ? '+' : '−'}${Formatter.num(amt)} €` : 'Changes saved');
  },

  removeTx(k, i) {
    const m = STATE.months[k], t = m?.tx[i];
    if (!t) return;
    const row = this.itemEl(k, i);
    const go = () => {
      if (!DataManager.deleteTransaction(k, i)) return;
      buzz([10, 40, 10]);
      this.render();
      DataManager.showIndicator('Transaction deleted', { label: 'Undo', fn: () => {
        m.tx.splice(Math.min(i, m.tx.length), 0, t);
        DataManager._recalcTotals(m);
        DataManager.save();
        this._flashTs = t.ts;
        this.render();
      }});
    };
    if (row && !still()) { row.classList.add('leaving'); setTimeout(go, 320); } else go();
  }
};

/* ════════════ SHEETS ════════════ */
const Sheet = {
  open(d) {
    if (d.open) return;
    d.classList.remove('closing');
    d.style.transform = '';
    d.showModal();
    document.body.classList.add('sheet-open');
  },
  close(d) {
    if (!d.open || d.classList.contains('closing')) return;
    d.dispatchEvent(new Event('sheetclose'));   // fires right away, before the exit animation
    if (still()) { d.close(); return; }
    d.classList.add('closing');
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      d.removeEventListener('animationend', done);
      d.classList.remove('closing');
      d.style.transform = '';
      d.close();
      if (!document.querySelector('dialog[open]')) document.body.classList.remove('sheet-open');
    };
    const done = e => { if (e.target === d) finish(); };   // ignore animations of children
    d.addEventListener('animationend', done);
    setTimeout(finish, 450);   // fallback if animationend never fires (e.g. app sent to background)
  },
  init(d) {
    d.addEventListener('cancel', e => { e.preventDefault(); this.close(d); });
    d.addEventListener('click', e => { if (e.target === d) this.close(d); });   // backdrop tap
    d.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => this.close(d)));
    d.addEventListener('close', () => { if (!document.querySelector('dialog[open]')) document.body.classList.remove('sheet-open'); });

    // drag the handle down to dismiss (bottom-sheet layout only)
    const grab = d.querySelector('.sheet-grab');
    let y0 = null, dy = 0, t0 = 0;
    grab.addEventListener('pointerdown', e => {
      if (matchMedia('(min-width: 768px)').matches) return;
      y0 = e.clientY; dy = 0; t0 = performance.now();
      grab.setPointerCapture(e.pointerId);
      d.style.transition = 'none';
    });
    grab.addEventListener('pointermove', e => {
      if (y0 === null) return;
      dy = Math.max(0, e.clientY - y0);
      d.style.transform = `translateY(${dy}px)`;
    });
    const end = () => {
      if (y0 === null) return;
      y0 = null;
      const v = dy / Math.max(1, performance.now() - t0);
      d.style.transition = '';
      if (dy > 110 || (v > 0.6 && dy > 30)) return this.close(d);
      d.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1)';
      d.style.transform = '';
      setTimeout(() => { d.style.transition = ''; }, 420);
    };
    grab.addEventListener('pointerup', end);
    grab.addEventListener('pointercancel', end);
  }
};

/* ════════════ THEME ════════════ */
const Theme = {
  mq: matchMedia('(prefers-color-scheme: dark)'),
  mode() { return localStorage.getItem(CONFIG.THEME_KEY) || 'auto'; },
  resolved() { const m = this.mode(); return m === 'auto' ? (this.mq.matches ? 'dark' : 'light') : m; },
  init() {
    this.apply(this.resolved());
    this.mq.addEventListener('change', () => { if (this.mode() === 'auto') this.apply(this.resolved()); });
    this.sync();
    document.querySelectorAll('#theme-seg .seg-btn').forEach(b => b.addEventListener('click', () => this.set(b.dataset.mode, b)));
  },
  set(mode, origin) {
    if (mode === 'auto') localStorage.removeItem(CONFIG.THEME_KEY); else localStorage.setItem(CONFIG.THEME_KEY, mode);
    this.sync();
    const next = this.resolved();
    if (next === document.body.dataset.theme) return;
    if (!document.startViewTransition || still()) return this.apply(next);
    // circular reveal from the tapped button
    const r = origin.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const s = document.documentElement.style;
    s.setProperty('--vx', x + 'px'); s.setProperty('--vy', y + 'px');
    s.setProperty('--vr', Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 'px');
    document.startViewTransition(() => this.apply(next));
  },
  apply(theme) {
    document.body.dataset.theme = theme;
    $('theme-color').content = theme === 'dark' ? '#070a12' : '#eef1f8';
  },
  sync() {
    const mode = this.mode(), seg = $('theme-seg');
    seg.dataset.mode = mode;
    seg.querySelectorAll('.seg-btn').forEach(b => b.setAttribute('aria-checked', String(b.dataset.mode === mode)));
  }
};

/* ════════════ FILE MANAGER (unchanged format) ════════════ */
const FileManager = {
  exportToTxt() {
    try {
      DataManager.refreshAllCarries();
      let txt = 'SALARY TRACKER BACKUP - ' + new Date().toLocaleString() + '\n';
      txt += '='.repeat(50) + '\n\n';

      Object.keys(STATE.months).sort().forEach(mk => {
        const m   = STATE.months[mk];
        const fin = m.carry + m.income - m.expense;
        txt += `MONTH: ${mk}\n`;
        txt += '-'.repeat(40) + '\n';
        txt += `Carry from previous: ${m.carry.toFixed(2)} €\n`;
        txt += `Total Income: ${m.income.toFixed(2)} €\n`;
        txt += `Total Expense: ${m.expense.toFixed(2)} €\n`;
        txt += `Final Balance: ${fin.toFixed(2)} € (≈ ${Formatter.convertToBGN(fin)} BGN)\n\n`;
        txt += 'TRANSACTIONS:\n';
        if (m.tx.length === 0) {
          txt += '  (No transactions)\n';
        } else {
          m.tx.forEach(t => {
            const bgn  = Formatter.convertToBGN(t.amt);
            const sign = t.type === 'income' ? '+' : '-';
            txt += `  [${Formatter.formatDate(t.ts)}|${t.ts}] ${sign}${t.amt.toFixed(2)} € (≈ ${bgn} BGN) - ${t.type.toUpperCase()} - ${t.desc}\n`;
          });
        }
        txt += '\n' + '='.repeat(50) + '\n\n';
      });

      const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `myBalance - ${Formatter.filenameDateStamp()}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
      DataManager.showIndicator('✓ Backup downloaded');
    } catch (e) {
      DataManager.showIndicator('✕ Export failed');
    }
  },

  importFromTxt(file) {
    try {
      const reader = new FileReader();
      reader.onload = e => {
        const imported = this.parseTxt(e.target.result);
        if (!imported || Object.keys(imported).length === 0) {
          DataManager.showIndicator('✕ Invalid file format');
          return;
        }
        const replace = confirm('Replace all data with imported data?\n\nOK = Replace\nCancel = Merge');
        if (replace) {
          STATE.months = imported;
        } else {
          Object.keys(imported).forEach(mk => {
            const imp = imported[mk];
            const ex  = STATE.months[mk];
            if (!ex) {
              STATE.months[mk] = imp;
            } else {
              imp.tx.forEach(it => {
                const dup = ex.tx.some(et => et.ts === it.ts && et.amt === it.amt && et.type === it.type && et.desc === it.desc);
                if (!dup) ex.tx.unshift(it);
              });
            }
          });
        }
        Object.values(STATE.months).forEach(m => DataManager._recalcTotals(m));
        DataManager.refreshAllCarries();
        DataManager.save();
        STATE.selectedMonth = null;
        UI.clearFilters();
        UI._enter = true;
        UI.render();
        DataManager.showIndicator('✓ Imported successfully');
      };
      reader.readAsText(file);
    } catch {
      DataManager.showIndicator('✕ Import failed');
    }
  },

  parseTxt(content) {
    try {
      const lines = content.split('\n');
      const data  = {};
      let cur = null, txs = [], md = { income: 0, expense: 0, carry: 0 };

      for (const raw of lines) {
        const line = raw.trim();
        if (line.startsWith('MONTH:')) {
          if (cur) data[cur] = { ...md, tx: txs };
          cur = line.replace('MONTH:', '').trim();
          txs = []; md = { income: 0, expense: 0, carry: 0 };
        } else if (line.startsWith('Carry from previous:')) {
          const m = line.match(/([-]?\d+\.?\d*)/); if (m) md.carry = parseFloat(m[1]);
        } else if (line.startsWith('Total Income:')) {
          const m = line.match(/([-]?\d+\.?\d*)/); if (m) md.income = parseFloat(m[1]);
        } else if (line.startsWith('Total Expense:')) {
          const m = line.match(/([-]?\d+\.?\d*)/); if (m) md.expense = parseFloat(m[1]);
        } else if (line.startsWith('[') && cur) {
          const m = line.match(/\[(.*?)\|(\d+)\]\s*([\+\-])(\d+\.?\d*)\s*€.*?-\s*(INCOME|EXPENSE)\s*-\s*(.*)/i);
          if (m) {
            const ts = parseInt(m[2]);
            if (!isNaN(ts)) txs.push({ desc: m[6].trim(), amt: parseFloat(m[4]), type: m[5].toLowerCase(), ts });
          }
        }
      }
      if (cur) data[cur] = { ...md, tx: txs };
      return data;
    } catch { return null; }
  }
};

/* Swipe left/right anywhere on the content to change month */
(() => {
  const zone = document.querySelector('.layout');
  zone.style.touchAction = 'pan-y';
  let x0 = null, y0 = 0, t0 = 0;
  zone.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || e.target.closest('.months, .days, .search, .tx-row')) return;
    x0 = e.clientX; y0 = e.clientY; t0 = Date.now();
  });
  zone.addEventListener('pointerup', e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - t0 < 700) UI.stepMonth(dx < 0 ? 1 : -1);
  });
  zone.addEventListener('pointercancel', () => { x0 = null; });
})();

/* Swipe an entry right-to-left to delete it (asks first) */
(() => {
  const list = $('list');
  let s = null;
  const reset = row => { row.classList.remove('dragging'); row.style.transform = ''; row.parentElement.classList.remove('armed'); };
  list.addEventListener('pointerdown', e => {
    const row = e.target.closest('.tx-row');
    if (!row || e.pointerType === 'mouse') return;
    s = { row, x: e.clientX, y: e.clientY, dx: 0, locked: false, id: e.pointerId };
  });
  list.addEventListener('pointermove', e => {
    if (!s || e.pointerId !== s.id) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.locked) {
      if (Math.abs(dx) < 10) return;
      if (Math.abs(dy) > Math.abs(dx) || dx > 0) { s = null; return; }   // scrolling, or a right swipe
      s.locked = true;
      try { s.row.setPointerCapture(e.pointerId); } catch {}
      s.row.classList.add('dragging');
    }
    s.dx = Math.min(0, dx);
    const w = s.row.offsetWidth, x = s.dx < -w * 0.35 ? -w * 0.35 + (s.dx + w * 0.35) * 0.35 : s.dx;   // rubber band
    s.row.style.transform = `translateX(${x}px)`;
    const armed = s.dx < -90;
    if (armed !== s.row.parentElement.classList.contains('armed')) { s.row.parentElement.classList.toggle('armed', armed); if (armed) buzz(8); }
  });
  list.addEventListener('pointerup', e => {
    if (!s || e.pointerId !== s.id) return;
    const { row, dx, locked } = s;
    s = null;
    if (!locked) return;
    UI._swiped = true; setTimeout(() => { UI._swiped = false; }, 60);
    row.classList.remove('dragging');
    if (dx < -90) { row.style.transform = 'translateX(-112px)'; UI.confirmDelete(row.dataset.k, +row.dataset.i); }
    else reset(row);
  });
  list.addEventListener('pointercancel', () => { if (s) reset(s.row); s = null; });
})();

/* Keep sheets above the on-screen keyboard (iOS overlays it instead of resizing the page) */
if (window.visualViewport) {
  const vv = visualViewport, root = document.documentElement;
  let maxH = vv.height, lastW = innerWidth;
  const fit = () => {
    if (innerWidth !== lastW) { lastW = innerWidth; maxH = vv.height; }   // rotation
    maxH = Math.max(maxH, vv.height);
    const kb = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop));
    root.style.setProperty('--kb', kb + 'px');
    root.style.setProperty('--vvh', Math.round(vv.height) + 'px');
    // Android resizes the page instead, so also treat a much shorter viewport as "keyboard open"
    root.classList.toggle('kb-open', kb > 120 || vv.height < maxH * 0.78);
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
  fit();
}
/* Bring the focused field into view inside a sheet once the keyboard has opened */

}));
new IntersectionObserver(([e]) => {

/* ════════════ GUIDE TOUR ════════════ */
const Guide = {
  SEEN_KEY: 'salary-tracker-guide-seen',
  STEPS: [
    { sel: '.topbar-in',   title: 'Welcome to myBalance €', body: 'Your personal finance tracker. Everything is stored locally in your browser — no account, no server, no data leaves your device.' },
    { sel: '#summary',     title: 'Your month at a glance', body: 'Balance, income, spending and how much of your money is already spent — in EUR and BGN.' },
    { sel: '#months-nav',  title: 'Switch months',          body: 'Tap a month here. On a phone you can also swipe left or right anywhere on the page.' },
    { sel: '#list',        title: 'Your transactions',      body: 'Grouped by day, newest first. Tap an entry to edit or delete it, or swipe it left to delete. Deletes ask first and can be undone.' },
    { sel: '#fab, #new-btn', title: 'Add in seconds',       body: 'Tap + to add income or an expense. Your recent descriptions appear as one-tap shortcuts.' },
    { sel: '#settings-btn', title: 'Theme & backup',        body: 'Pick Auto, Light or Dark theme, and download or restore a .txt backup of all your data.' }
  ],
  _step: 0, _open: false,
  init() {
    $('guide-next').addEventListener('click', () => this.next());
    $('guide-skip').addEventListener('click', () => this.finish());
    addEventListener('resize', () => { if (this._open) this._show(this._step); });
    document.addEventListener('keydown', e => { if (this._open && e.key === 'Escape') this.finish(); });
    if (!localStorage.getItem(this.SEEN_KEY)) setTimeout(() => this.start(), 900);
  },
  start() { this._step = 0; this._open = true; this._show(0); },
  _show(n) {
    const step = this.STEPS[n];
    const target = [...document.querySelectorAll(step.sel)].find(el => el.getClientRects().length);
    $('guide-title').textContent   = step.title;
    $('guide-body').textContent    = step.body;
    $('guide-counter').textContent = `${n + 1} / ${this.STEPS.length}`;
    $('guide-next').textContent    = n === this.STEPS.length - 1 ? 'Finish' : 'Next';

    const hl = $('guide-highlight'), tt = $('guide-tooltip');
    hl.style.display = 'block';
    tt.style.display = 'block';
    $('guide-next').focus({ preventScroll: true });
    if (!target) return;

    target.scrollIntoView({ block: 'nearest' });
    requestAnimationFrame(() => {
      const r = target.getBoundingClientRect();
      const pad = 6;
      Object.assign(hl.style, { left: `${r.left - pad}px`, top: `${r.top - pad}px`, width: `${r.width + pad * 2}px`, height: `${r.height + pad * 2}px` });

      const vw = innerWidth, vh = innerHeight;
      const maxW = Math.min(340, vw - 32);
      const th = tt.offsetHeight || 170;
      let top  = r.bottom + pad + 12;
      let left = r.left;
      if (top + th > vh - 16) top = r.top - pad - 12 - th;
      if (top < 16) top = Math.max(16, vh - th - 16);   // target taller than viewport: pin to bottom
      if (left + maxW > vw - 16) left = vw - maxW - 16;
      if (left < 16) left = 16;
      Object.assign(tt.style, { top: `${top}px`, left: `${left}px`, maxWidth: `${maxW}px` });
    });
  },
  next() { this._step++; this._step >= this.STEPS.length ? this.finish() : this._show(this._step); },
  finish() {
    this._open = false;
    $('guide-highlight').style.display = 'none';
    $('guide-tooltip').style.display   = 'none';
    localStorage.setItem(this.SEEN_KEY, '1');
  }
};

(function tick() {
  const el = $('live-date');

    const now = new Date();
    const full  = now.toLocaleString('en-GB', { weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', hour12: false });
    const short = now.toLocaleString('en-GB', { hour:'2-digit', minute:'2-digit', hour12: false });
    el.innerHTML = `<span class="full">${full}</span><span class="short">${short}</span>`;
  }
  setTimeout(tick, 1000 * (60 - new Date().getSeconds()) || 1000);
})();
