<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Free personal salary tracker app. Manage monthly income, expenses, balances in EUR/BGN with secure client-side storage. No signup required.">
  <meta name="theme-color" id="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RTDN | myBalance €</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'><defs><linearGradient id='g' x1='0' y1='1' x2='0' y2='0'><stop offset='0' stop-color='%235b3df5'/><stop offset='1' stop-color='%2300d68f'/></linearGradient></defs><rect width='56' height='56' rx='16' fill='%23131b2a'/><rect x='13' y='32' width='8' height='14' rx='3' fill='url(%23g)'/><rect x='24' y='22' width='8' height='24' rx='3' fill='url(%23g)'/><rect x='35' y='10' width='8' height='36' rx='3' fill='url(%23g)'/></svg>">
  <style>
    /* ══════════ TOKENS ══════════ */
    :root {
      --bg:          #070a12;
      --surface:     rgba(18,25,40,0.94);
      --surface-solid:#111827;
      --card:        #182132;
      --card-hover:  rgba(255,255,255,0.045);
      --glass:       rgba(7,10,18,0.72);
      --border:      rgba(255,255,255,0.07);
      --border-hi:   rgba(255,255,255,0.14);
      --text:        #eef2f8;
      --text2:       #8c99b0;
      --text3:       #b4bfd0;

      --primary:     #7c74ff;
      --primary-2:   #a26bff;
      --primary-dim: rgba(124,116,255,0.16);
      --primary-glow:rgba(124,116,255,0.4);
      --on-primary:  #ffffff;
      --income:      #00d68f;
      --income-dim:  rgba(0,214,143,0.13);
      --expense:     #ff6b88;
      --expense-dim: rgba(255,107,136,0.13);
      --carry:       #ffb340;
      --carry-dim:   rgba(255,179,64,0.13);

      --hero-bg:
        radial-gradient(120% 90% at 0% 0%, rgba(124,116,255,0.38), transparent 60%),
        radial-gradient(90% 80% at 100% 100%, rgba(0,214,143,0.22), transparent 60%),
        linear-gradient(150deg, #1a1d45 0%, #121a2f 50%, #0c1a1f 100%);
      --hero-neg:
        radial-gradient(120% 90% at 0% 0%, rgba(255,107,136,0.32), transparent 60%),
        radial-gradient(90% 80% at 100% 100%, rgba(124,116,255,0.18), transparent 60%),
        linear-gradient(150deg, #3a1726 0%, #1a1426 55%, #121827 100%);
      --edge: linear-gradient(140deg, rgba(160,150,255,0.6), rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.04) 60%, rgba(0,214,143,0.45));

      --r-sm: 12px; --r: 16px; --r-lg: 20px; --r-xl: 28px;
      --shadow-sm: 0 1px 0 rgba(255,255,255,0.04) inset, 0 4px 16px rgba(0,0,0,0.28);
      --shadow:    0 1px 0 rgba(255,255,255,0.05) inset, 0 12px 36px rgba(0,0,0,0.42);
      --shadow-lg: 0 24px 70px rgba(0,0,0,0.6);

      --tap: 44px;
      --gutter: 16px;
      --maxw: 560px;
      --ease-out:    cubic-bezier(.22,1,.36,1);
      --ease-spring: cubic-bezier(.34,1.56,.64,1);
      --dots: rgba(255,255,255,0.035);
    }
    [data-theme="light"] {
      --bg:          #eef1f8;
      --surface:     rgba(255,255,255,0.96);
      --surface-solid:#ffffff;
      --card:        #f3f5fb;
      --card-hover:  rgba(15,23,42,0.035);
      --glass:       rgba(238,241,248,0.78);
      --border:      rgba(15,23,42,0.07);
      --border-hi:   rgba(15,23,42,0.14);
      --text:        #0d1626;
      --text2:       #5b6880;
      --text3:       #3f4b60;
      --primary:     #5046e4;
      --primary-2:   #7c3aed;
      --primary-dim: rgba(80,70,228,0.1);
      --primary-glow:rgba(80,70,228,0.3);
      --income:      #00875a;
      --income-dim:  rgba(0,135,90,0.1);
      --expense:     #d6203f;
      --expense-dim: rgba(214,32,63,0.09);
      --carry:       #b36b00;
      --carry-dim:   rgba(179,107,0,0.1);
      --hero-bg:
        radial-gradient(120% 90% at 0% 0%, rgba(80,70,228,0.2), transparent 60%),
        radial-gradient(90% 80% at 100% 100%, rgba(0,135,90,0.16), transparent 60%),
        linear-gradient(150deg, #eef0ff 0%, #ffffff 55%, #eafaf3 100%);
      --hero-neg:
        radial-gradient(120% 90% at 0% 0%, rgba(214,32,63,0.16), transparent 60%),
        linear-gradient(150deg, #fff0f3 0%, #ffffff 60%, #f3f1ff 100%);
      --edge: linear-gradient(140deg, rgba(80,70,228,0.45), rgba(15,23,42,0.06) 40%, rgba(15,23,42,0.05) 60%, rgba(0,135,90,0.35));
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.05), 0 4px 14px rgba(15,23,42,0.05);
      --shadow:    0 2px 4px rgba(15,23,42,0.04), 0 12px 32px rgba(15,23,42,0.08);
      --shadow-lg: 0 24px 70px rgba(15,23,42,0.2);
      --dots: rgba(15,23,42,0.05);
    }

    /* ══════════ BASE ══════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); touch-action: manipulation; }
    body {
      font-family: 'Roboto', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .3s, color .3s;
    }
    body.sheet-open { overflow: hidden; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    svg { flex-shrink: 0; }

    /* Drifting aurora + dot grid behind everything */
    body::before {
      content: ''; position: fixed; inset: -15%; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 55% 35% at 15% 5%,  rgba(124,116,255,0.12), transparent 65%),
        radial-gradient(ellipse 50% 35% at 90% 80%, rgba(0,214,143,0.07), transparent 65%),
        radial-gradient(ellipse 35% 25% at 70% 30%, rgba(255,107,136,0.05), transparent 60%);
      animation: aurora 28s ease-in-out infinite alternate;
      will-change: transform;
    }
    [data-theme="light"]::before {
      background:
        radial-gradient(ellipse 55% 35% at 15% 5%, rgba(80,70,228,0.09), transparent 65%),
        radial-gradient(ellipse 50% 35% at 90% 80%, rgba(0,135,90,0.06), transparent 65%);
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(var(--dots) 1px, transparent 1px);
      background-size: 22px 22px;
      -webkit-mask-image: radial-gradient(ellipse 90% 55% at 50% 0%, #000 25%, transparent 75%);
              mask-image: radial-gradient(ellipse 90% 55% at 50% 0%, #000 25%, transparent 75%);
    }

    .wrap {
      max-width: var(--maxw); margin: 0 auto;
      padding-left:  calc(var(--gutter) + env(safe-area-inset-left));
      padding-right: calc(var(--gutter) + env(safe-area-inset-right));
    }
    .app { position: relative; z-index: 1; padding-bottom: calc(120px + env(safe-area-inset-bottom)); }

    /* ══════════ TOP BAR ══════════ */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      padding-top: env(safe-area-inset-top);
      transition: background-color .3s, box-shadow .3s;
    }
    .scrolled .topbar {
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%);
      box-shadow: 0 1px 0 var(--border);
    }
    .topbar-in { display: flex; align-items: center; gap: 12px; height: 64px; }
    .brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 42px; height: 42px; filter: drop-shadow(0 6px 14px rgba(91,61,245,0.35)); }
    .brand-mark .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: barUp .9s var(--ease-spring) backwards; }
    .brand-mark .b2 { animation-delay: .12s; } .brand-mark .b3 { animation-delay: .24s; }
    .brand-lines { min-width: 0; display: grid; }
    .brand-name { font-size: 1.28rem; font-weight: 700; letter-spacing: -0.5px; line-height: 1.15; white-space: nowrap; }
    .brand-word {
      background: linear-gradient(180deg, #ffffff 20%, #c9c2ff 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    [data-theme="light"] .brand-word { background-image: linear-gradient(180deg, #0d1626 30%, #4b3fd6 100%); }
    .brand-euro { color: var(--income); margin-left: .18em; }
    .brand-sub, .mini-bal {
      grid-area: 2 / 1; display: flex; align-items: center; gap: 7px;
      font-family: 'Roboto Mono', monospace; font-size: .72rem; color: var(--text2);
      white-space: nowrap; overflow: hidden; margin-top: 2px;
      transition: opacity .3s, transform .4s var(--ease-out);
    }
    .brand-tag { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: .66rem; letter-spacing: 2.4px; color: var(--text3); }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--income); animation: livePulse 2s ease-out infinite; }
    .mini-bal { opacity: 0; transform: translateY(8px); font-weight: 700; color: var(--text); font-size: .8rem; }
    .mini-bal.neg { color: var(--expense); }
    .show-mini .mini-bal { opacity: 1; transform: none; }
    .show-mini .brand-sub { opacity: 0; transform: translateY(-8px); }

    .icon-btn {
      width: var(--tap); height: var(--tap); border-radius: 14px;
      display: grid; place-items: center; color: var(--text3);
      background: var(--surface); border: 1px solid var(--border);
      transition: background-color .2s, color .2s, border-color .2s, transform .15s;
    }
    .icon-btn:active { transform: scale(.92); }
    .topbar .btn-new { display: none; }

    /* ══════════ MONTH STRIP ══════════ */
    .months {
      display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity;
      /* extra vertical room so the active chip's glow isn't clipped by the scroller */
      margin: -6px calc(-1 * var(--gutter)) -6px; padding: 10px var(--gutter) 20px;
      scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--gutter), #000 calc(100% - var(--gutter)), transparent);
              mask-image: linear-gradient(90deg, transparent, #000 var(--gutter), #000 calc(100% - var(--gutter)), transparent);
    }
    .months::-webkit-scrollbar { display: none; }
    .mchip {
      flex: none; scroll-snap-align: center;
      min-width: 64px; height: 54px; padding: 0 12px; border-radius: 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      background: var(--surface); border: 1px solid var(--border); color: var(--text3);
      transition: background-color .25s, color .25s, border-color .25s, transform .2s var(--ease-out), box-shadow .25s;
    }
    .mchip b { font-size: .95rem; font-weight: 700; }
    .mchip small { font-size: .66rem; font-weight: 500; color: var(--text2); letter-spacing: .3px; }
    .mchip.now small { color: var(--income); font-weight: 700; }
    .mchip:active { transform: scale(.94); }
    .mchip.active {
      background: linear-gradient(140deg, var(--primary), var(--primary-2));
      border-color: transparent; color: var(--on-primary);
      box-shadow: 0 6px 14px var(--primary-glow);
      animation: chipPop .45s var(--ease-spring);
    }
    .mchip.active small { color: rgba(255,255,255,.8); }

    /* ══════════ HERO / SUMMARY ══════════ */
    .hero {
      position: relative; overflow: hidden; isolation: isolate;
      border-radius: var(--r-xl); padding: 20px 20px 18px;
      border: 1px solid transparent;
      background: var(--hero-bg) padding-box, var(--edge) border-box;
      box-shadow: var(--shadow), 0 20px 50px -20px var(--primary-glow);
    }
    .hero.neg { background: var(--hero-neg) padding-box, var(--edge) border-box; box-shadow: var(--shadow), 0 20px 50px -20px rgba(255,107,136,.35); }
    /* one-off light sweep across the card */
    .hero::after {
      content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%);
      transform: translateX(-120%);
    }
    .enter .hero::after { animation: sweep 1.6s var(--ease-out) .5s; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .hero-label { font-size: .74rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text2); }
    .hero-month {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .78rem; font-weight: 600; color: var(--text3);
      padding: 5px 10px; border-radius: 99px; background: var(--card-hover); border: 1px solid var(--border);
    }
    .hero-amount {
      margin-top: 12px; font-size: clamp(2.3rem, 11vw, 3rem); font-weight: 700;
      letter-spacing: -1.5px; line-height: 1; white-space: nowrap;
    }
    .hero-amount .cents { font-size: .5em; letter-spacing: -.5px; opacity: .7; }
    .hero-amount .cur   { font-size: .5em; font-weight: 500; opacity: .7; }
    .hero.neg .hero-amount { color: var(--expense); }
    .hero-bgn { font-family: 'Roboto Mono', monospace; font-size: .8rem; color: var(--text2); margin-top: 8px; }
    .meter { margin-top: 18px; height: 8px; border-radius: 99px; background: var(--border-hi); overflow: hidden; }
    .meter-fill {
      display: block; height: 100%; border-radius: inherit; transform-origin: left;
      background: linear-gradient(90deg, var(--income), #5be3b4);
      transition: transform 1.2s var(--ease-out) .2s;
    }
    .meter.warn .meter-fill { background: linear-gradient(90deg, var(--income), var(--carry)); }
    .meter.high .meter-fill { background: linear-gradient(90deg, var(--carry), var(--expense)); }
    .meter-text { display: flex; justify-content: space-between; gap: 10px; margin-top: 9px; font-size: .8rem; color: var(--text2); }
    .meter-text b { color: var(--text); font-weight: 700; }
    .meter-text.muted { margin-top: 16px; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .stats .carry { grid-column: 1 / -1; }
    .stat {
      display: flex; align-items: center; gap: 11px; min-width: 0;
      padding: 13px 14px; border-radius: var(--r-lg);
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .stat-ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; }
    .stat.income .stat-ico { background: var(--income-dim); color: var(--income); }
    .stat.expense .stat-ico { background: var(--expense-dim); color: var(--expense); }
    .stat.carry .stat-ico { background: var(--carry-dim); color: var(--carry); }
    .stat-txt { min-width: 0; }
    .stat-label { font-size: .7rem; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--text2); }
    .stat-val { font-size: 1.05rem; font-weight: 700; letter-spacing: -.3px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat.income .stat-val { color: var(--income); }
    .stat.expense .stat-val { color: var(--expense); }
    .stat.carry .stat-val { color: var(--carry); }
    .stat-bgn { font-family: 'Roboto Mono', monospace; font-size: .7rem; color: var(--text2); margin-top: 1px; }

    /* ══════════ TRANSACTIONS ══════════ */
    .list-head { display: flex; align-items: center; gap: 8px; margin: 26px 2px 4px; }
    .section-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -.2px; }
    .count {
      min-width: 24px; height: 22px; padding: 0 7px; border-radius: 99px;
      display: inline-grid; place-items: center;
      font-size: .74rem; font-weight: 700; color: var(--primary); background: var(--primary-dim);
    }
    .swipe-hint { margin-left: auto; font-size: .74rem; color: var(--text2); display: inline-flex; align-items: center; gap: 4px; }
    .tx-day { margin-top: 14px; }
    .day-label {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 0 4px 7px; font-size: .74rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text2);
    }
    .day-label span { font-family: 'Roboto Mono', monospace; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .tx-group {
      border-radius: var(--r-lg); overflow: hidden;
      background: var(--surface-solid); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .tx-item { position: relative; overflow: hidden; }
    .tx-item + .tx-item::before { content: ''; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--border); z-index: 2; }
    /* red layer revealed when an entry is swiped left */
    .tx-del-bg {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      padding-right: 22px; font-weight: 700; font-size: .9rem; color: #fff;
      background: linear-gradient(90deg, #ff8aa1, #e8364f);
    }
    .tx-del-bg svg { transition: transform .3s var(--ease-spring); }
    .tx-item.armed .tx-del-bg svg { transform: scale(1.25) rotate(-8deg); }
    .tx-row {
      width: 100%; min-height: 66px; padding: 11px 14px; background: var(--surface-solid);
      touch-action: pan-y;
      display: grid; grid-template-columns: 42px minmax(0,1fr) auto; align-items: center; gap: 12px;
      text-align: left; position: relative;
      transition: background-color .2s, transform .4s var(--ease-spring);
    }
    .tx-row.dragging { transition: none; }
    .tx-row:active { background: var(--card); }
    .tx-ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; }
    .tx-row.income  .tx-ico { background: var(--income-dim);  color: var(--income); }
    .tx-row.expense .tx-ico { background: var(--expense-dim); color: var(--expense); }
    .tx-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .tx-desc { font-size: .97rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-family: 'Roboto Mono', monospace; font-size: .72rem; color: var(--text2); }
    .tx-amount { text-align: right; display: flex; flex-direction: column; gap: 3px; }
    .tx-eur { font-size: .97rem; font-weight: 700; white-space: nowrap; }
    .tx-row.income  .tx-eur { color: var(--income); }
    .tx-row.expense .tx-eur { color: var(--text); }
    .tx-bgn { font-family: 'Roboto Mono', monospace; font-size: .7rem; color: var(--text2); white-space: nowrap; }

    .carry-banner {
      margin-top: 14px; display: flex; align-items: center; gap: 12px;
      padding: 13px 14px; border-radius: var(--r-lg);
      background: var(--carry-dim); border: 1px solid rgba(255,179,64,.22); color: var(--carry);
    }
    .carry-banner .ttl { flex: 1; font-size: .88rem; font-weight: 500; }
    .carry-banner .amt { text-align: right; font-weight: 700; white-space: nowrap; }
    .carry-banner .amt small { display: block; font-family: 'Roboto Mono', monospace; font-weight: 400; font-size: .7rem; color: var(--text2); }

    .empty {
      margin-top: 14px; padding: 36px 20px; text-align: center; border-radius: var(--r-lg);
      border: 1px dashed var(--border-hi); color: var(--text2);
    }
    .empty-art { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 22px; display: grid; place-items: center; background: var(--primary-dim); color: var(--primary); animation: float 4s ease-in-out infinite; }
    .empty b { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }
    .empty p { font-size: .9rem; line-height: 1.5; }
    .empty .btn-primary { display: flex; width: fit-content; margin: 18px auto 0; padding: 0 22px; height: 48px; flex: none; }

    /* search + day filter */
    .list-tools { display: flex; gap: 8px; margin-top: 12px; }
    .search {
      flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px;
      border-radius: 14px; background: var(--surface); border: 1.5px solid var(--border); color: var(--text2);
      transition: border-color .2s, box-shadow .2s;
    }
    .search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-dim); }
    .search input {
      flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent;
      font: 400 16px 'Roboto', sans-serif; color: var(--text);   /* 16px stops iOS zooming on focus */
    }
    .search input::placeholder { color: var(--text2); }
    .search input::-webkit-search-cancel-button { display: none; }
    .search-clear { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--text2); animation: chipIn .25s var(--ease-spring); }
    .days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px calc(-1 * var(--gutter)) 0; padding: 2px var(--gutter) 4px; }
    .days::-webkit-scrollbar { display: none; }
    .dchip {
      flex: none; min-width: 48px; height: 50px; padding: 0 10px; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      background: var(--surface); border: 1px solid var(--border); color: var(--text3);
      transition: background-color .2s, color .2s, border-color .2s, transform .15s;
    }
    .dchip b { font-size: .92rem; font-weight: 700; }
    .dchip small { font-size: .62rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; }
    .dchip:active { transform: scale(.93); }
    .dchip.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); animation: chipPop .4s var(--ease-spring); }
    .dchip.active small { color: var(--primary); }
    .results {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-top: 12px; padding: 0 4px; font-size: .84rem; color: var(--text2);
    }
    .results b { color: var(--text); }
    .link-btn { height: 34px; padding: 0 12px; border-radius: 10px; font-size: .82rem; font-weight: 700; color: var(--primary); background: var(--primary-dim); }
    .elsewhere { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }

    /* ══════════ BUTTONS ══════════ */
    .btn-primary {
      flex: 1; height: 54px; border-radius: 16px; padding: 0 18px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 1rem; font-weight: 700; letter-spacing: .2px; color: var(--on-primary);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      box-shadow: 0 8px 24px var(--primary-glow);
      position: relative; overflow: hidden; isolation: isolate;
      transition: transform .15s var(--ease-out), box-shadow .25s, filter .2s;
    }
    .btn-primary::after {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.3) 50%, transparent 70%);
      transform: translateX(-120%);
    }
    .btn-primary:active { transform: scale(.97); }
    .btn-danger {
      height: 54px; padding: 0 18px; border-radius: 16px;
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 700; color: var(--expense); background: var(--expense-dim);
      transition: transform .15s, background-color .2s;
    }
    .btn-danger:active { transform: scale(.96); }

    /* ══════════ FAB ══════════ */
    .fab {
      position: fixed; z-index: 60;
      right: calc(18px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));
      height: 60px; min-width: 60px; padding: 0 18px; border-radius: 22px;
      display: flex; align-items: center; justify-content: center; gap: 0;
      color: #fff; font-weight: 700; font-size: 1rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      /* glow kept within the 20px gap to the screen edge so it isn't cut off */
      box-shadow: 0 6px 18px -4px var(--primary-glow), 0 0 0 1px rgba(255,255,255,.08), 0 2px 0 rgba(255,255,255,.18) inset;
      animation: fabIn .7s var(--ease-spring) .45s backwards;
      transition: transform .2s var(--ease-out), box-shadow .25s, padding .35s var(--ease-out);
    }
    .fab:active { transform: scale(.92); }
    .fab-label { max-width: 90px; overflow: hidden; white-space: nowrap; margin-left: 8px; transition: max-width .35s var(--ease-out), margin .35s var(--ease-out), opacity .25s; }
    .scrolled .fab { padding: 0; width: 60px; }
    .scrolled .fab-label { max-width: 0; margin-left: 0; opacity: 0; }

    /* ══════════ TOAST ══════════ */
    .toast {
      position: fixed; z-index: 70; left: 50%;
      bottom: calc(92px + env(safe-area-inset-bottom));
      display: flex; align-items: center; gap: 14px;
      max-width: calc(100vw - 32px); padding: 10px 10px 10px 18px; min-height: 48px;
      border-radius: 16px; background: var(--surface-solid); color: var(--text);
      border: 1px solid var(--border-hi); box-shadow: var(--shadow-lg);
      font-size: .9rem; font-weight: 500;
      opacity: 0; pointer-events: none; transform: translate(-50%, 24px) scale(.94);
      transition: opacity .25s, transform .45s var(--ease-spring);
    }
    .toast:not(:has(button)) { padding-right: 18px; }
    .toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
    .toast button { height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 700; color: var(--primary); background: var(--primary-dim); }

    /* ══════════ SHEETS (native <dialog>) ══════════ */
    /* --kb / --vvh come from visualViewport so the sheet sits above the on-screen keyboard */
    .sheet {
      position: fixed; inset: auto 0 var(--kb, 0px) 0; margin: 0 auto;
      width: 100%; max-width: 560px; max-height: calc(var(--vvh, 100dvh) - 12px - env(safe-area-inset-top));
      border: none; border-radius: 28px 28px 0 0; padding: 0;
      background: var(--surface-solid); color: var(--text);
      box-shadow: 0 -10px 60px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.08) inset;
      overflow-y: auto; overscroll-behavior: contain;
    }
    .sheet[open] { animation: sheetUp .55s var(--ease-out); }
    .sheet.closing { animation: sheetDown .3s cubic-bezier(.4,0,1,1) forwards; }
    .sheet::backdrop { background: rgba(3,5,10,.55); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); animation: fadeIn .35s ease; }
    .sheet.closing::backdrop { animation: fadeOut .3s ease forwards; }
    .sheet-inner { --pad: 20px; padding: 0 var(--pad) calc(20px + env(safe-area-inset-bottom)); }
    #tx-form .sheet-inner { padding-bottom: 0; }
    .sheet input { scroll-margin-bottom: 96px; }
    .sheet-grab { touch-action: none; padding-top: 10px; cursor: grab; }
    .grabber { display: block; width: 42px; height: 5px; border-radius: 99px; background: var(--border-hi); margin: 0 auto; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 14px; }
    .sheet-head h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.3px; }
    .sheet .icon-btn { background: var(--card); border-color: transparent; width: 40px; height: 40px; border-radius: 50%; }

    /* segmented control with a sliding pill */
    .seg {
      --count: 2; --n: 0;
      position: relative; display: grid; grid-template-columns: repeat(var(--count), 1fr);
      height: 52px; padding: 4px; border-radius: 16px; background: var(--card);
    }
    .seg::before {
      content: ''; position: absolute; top: 4px; bottom: 4px; left: 4px;
      width: calc((100% - 8px) / var(--count)); border-radius: 12px;
      background: var(--surface-solid); box-shadow: 0 2px 8px rgba(0,0,0,.18), 0 0 0 1px var(--border-hi);
      transform: translateX(calc(var(--n) * 100%));
      transition: transform .5s var(--ease-spring), background-color .3s, box-shadow .3s;
    }
    .seg-btn {
      position: relative; z-index: 1; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      font-size: .92rem; font-weight: 600; color: var(--text2); transition: color .25s;
    }
    .seg-btn[aria-checked="true"] { color: var(--text); }
    #type-seg[data-type="income"]  { --n: 0; }
    #type-seg[data-type="expense"] { --n: 1; }
    #type-seg[data-type="income"]::before  { background: var(--income-dim); box-shadow: inset 0 0 0 1.5px var(--income); }
    #type-seg[data-type="expense"]::before { background: var(--expense-dim); box-shadow: inset 0 0 0 1.5px var(--expense); }
    #type-seg[data-type="income"]  .seg-btn[aria-checked="true"] { color: var(--income); }
    #type-seg[data-type="expense"] .seg-btn[aria-checked="true"] { color: var(--expense); }

    .amount-field { position: relative; display: flex; align-items: baseline; justify-content: center; gap: 4px; padding: 22px 0 2px; }
    .amount-field .cur { font-size: 1.8rem; font-weight: 500; color: var(--text2); }
    #amount {
      width: 4.5ch; min-width: 4.5ch; max-width: 100%;
      font: 700 3.1rem/1.1 'Roboto', sans-serif; letter-spacing: -1.5px; text-align: center;
      color: var(--text); background: transparent; border: none; outline: none; caret-color: var(--primary);
      transition: color .3s, width .15s;
    }
    #amount::placeholder { color: var(--text2); opacity: .45; }
    #tx-form[data-type="income"]  #amount { color: var(--income); }
    #tx-form[data-type="expense"] #amount { color: var(--expense); }
    .amount-bgn { text-align: center; font-family: 'Roboto Mono', monospace; font-size: .8rem; color: var(--text2); min-height: 1.2em; }
    .amount-line { height: 2px; margin: 12px auto 18px; width: 60%; border-radius: 2px; background: var(--border-hi); position: relative; overflow: hidden; }
    .amount-line::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--primary), var(--primary-2)); transform: scaleX(0); transition: transform .45s var(--ease-out); }
    .amount-wrap:focus-within .amount-line::after { transform: scaleX(1); }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label { font-size: .8rem; font-weight: 600; color: var(--text3); padding-left: 2px; }
    .field input {
      height: 52px; width: 100%; padding: 0 16px; border-radius: 14px;
      font: 400 1rem 'Roboto', sans-serif; color: var(--text);
      background: var(--card); border: 1.5px solid transparent; outline: none;
      transition: border-color .2s, box-shadow .2s, background-color .2s;
    }
    .field input::placeholder { color: var(--text2); opacity: .8; }
    .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-dim); background: var(--surface-solid); }

    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 12px -20px 0; padding: 2px 20px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; height: 36px; padding: 0 14px; border-radius: 99px;
      font-size: .85rem; font-weight: 500; color: var(--text3);
      background: var(--card); border: 1px solid var(--border);
      max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      animation: chipIn .4s var(--ease-spring) backwards; animation-delay: calc(var(--i) * 40ms + 120ms);
      transition: transform .15s, background-color .2s, color .2s, border-color .2s;
    }
    .chip:active { transform: scale(.92); }
    .form-error { min-height: 1.3em; margin-top: 10px; font-size: .84rem; font-weight: 500; color: var(--expense); text-align: center; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
    #tx-form .sheet-actions {
      position: sticky; bottom: 0; z-index: 2;
      margin: 6px calc(-1 * var(--pad)) 0; padding: 14px var(--pad) calc(22px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--surface-solid) 14px);
    }
    /* the sheet scrolls, so its edge clips shadows: keep this glow inside the 22px padding */
    .sheet .btn-primary, .sheet .btn-primary:hover { box-shadow: 0 4px 16px -2px var(--primary-glow); }
    .btn-ghost { flex: 1; height: 54px; border-radius: 16px; font-weight: 700; color: var(--text); background: var(--card); transition: transform .15s; }
    .btn-ghost:active { transform: scale(.96); }
    .btn-danger.wide { flex: 1; justify-content: center; }

    /* entry details + confirm */
    .act-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--r-lg); background: var(--card); }
    .act-card .tx-ico { flex: none; }
    .act-card.income .tx-ico { background: var(--income-dim); color: var(--income); }
    .act-card.expense .tx-ico { background: var(--expense-dim); color: var(--expense); }
    .act-main { flex: 1; min-width: 0; }
    .act-desc { font-size: 1.02rem; font-weight: 700; overflow-wrap: anywhere; }
    .act-date { font-size: .8rem; color: var(--text2); margin-top: 3px; }
    .act-amt { text-align: right; font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
    .act-card.income .act-amt { color: var(--income); }
    .act-amt small { display: block; font-family: 'Roboto Mono', monospace; font-weight: 400; font-size: .72rem; color: var(--text2); margin-top: 3px; }
    .act-list { display: grid; gap: 10px; margin-top: 14px; }
    .act-btn {
      height: 56px; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 18px;
      font-size: 1rem; font-weight: 600; background: var(--card); transition: transform .15s, background-color .2s;
    }
    .act-btn:active { transform: scale(.97); }
    .act-btn.danger { color: var(--expense); background: var(--expense-dim); }
    .act-btn.edit svg { color: var(--primary); }
    .confirm-ico {
      width: 60px; height: 60px; margin: 6px auto 14px; border-radius: 20px; display: grid; place-items: center;
      background: var(--expense-dim); color: var(--expense); animation: chipPop .5s var(--ease-spring);
    }
    .confirm-title { text-align: center; font-size: 1.2rem; font-weight: 700; }
    .confirm-body { text-align: center; color: var(--text2); font-size: .92rem; line-height: 1.5; margin: 8px 0 20px; overflow-wrap: anywhere; }

    .kb-open .sheet-inner { padding-bottom: 14px; }
    .kb-open .sheet-head { padding: 6px 0 10px; }
    .kb-open .seg { height: 44px; }
    .kb-open .amount-field { padding-top: 10px; }
    .kb-open #amount { font-size: 2.3rem; }
    .kb-open .amount-line { margin: 8px auto 12px; }
    .kb-open .field input { height: 48px; }
    .kb-open .chips { margin-top: 8px; }
    .kb-open .form-error { min-height: 0; margin-top: 6px; }
    .kb-open .btn-primary, .kb-open .btn-danger { height: 50px; }
    .kb-open #tx-form .sheet-actions { padding-top: 10px; padding-bottom: 18px; }

    /* settings */
    .set-label { font-size: .74rem; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--text2); margin: 4px 2px 10px; }
    #theme-seg { --count: 3; }
    #theme-seg[data-mode="auto"]  { --n: 0; }
    #theme-seg[data-mode="light"] { --n: 1; }
    #theme-seg[data-mode="dark"]  { --n: 2; }
    .set-list { margin-top: 22px; border-radius: var(--r-lg); background: var(--card); overflow: hidden; }
    .set-item {
      width: 100%; min-height: 62px; padding: 10px 14px;
      display: flex; align-items: center; gap: 13px; text-align: left; position: relative;
      transition: background-color .2s;
    }
    .set-item + .set-item::before { content: ''; position: absolute; top: 0; left: 62px; right: 0; height: 1px; background: var(--border); }
    .set-item:active { background: var(--card-hover); }
    .set-ico { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--primary-dim); color: var(--primary); }
    .set-txt { flex: 1; min-width: 0; }
    .set-txt b { display: block; font-size: .95rem; font-weight: 600; }
    .set-txt small { display: block; font-size: .78rem; color: var(--text2); margin-top: 2px; }
    .set-item > svg:last-child { color: var(--text2); }
    .privacy { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 18px; font-size: .78rem; color: var(--text2); }

    /* ══════════ GUIDE TOUR ══════════ */
    #guide-highlight {
      position: fixed; pointer-events: none; border-radius: 22px; z-index: 9998;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.72);
      outline: 2px solid var(--primary); outline-offset: 4px;
      transition: left .4s var(--ease-out), top .4s var(--ease-out), width .4s var(--ease-out), height .4s var(--ease-out);
    }
    #guide-tooltip {
      position: fixed; z-index: 9999; width: calc(100vw - 32px); max-width: 340px;
      background: var(--surface-solid); border: 1px solid var(--border-hi);
      border-radius: 20px; padding: 20px 20px 16px; box-shadow: var(--shadow-lg);
      transition: top .4s var(--ease-out), left .4s var(--ease-out);
    }
    .guide-title { font-size: 1.02rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .guide-body  { font-size: .9rem; color: var(--text3); line-height: 1.6; margin-bottom: 16px; }
    .guide-footer { display: flex; align-items: center; gap: 8px; }
    #guide-skip, #guide-next { min-height: 42px; padding: 0 16px; border-radius: 12px; font-size: .86rem; font-weight: 600; }
    #guide-skip { border: 1px solid var(--border-hi); color: var(--text2); }
    #guide-next { background: var(--primary); color: var(--on-primary); }
    #guide-counter { flex: 1; text-align: center; font-size: .8rem; color: var(--text2); }

    /* ══════════ MOTION ══════════ */
    @keyframes aurora    { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-4%,3%,0) scale(1.08); } 100% { transform: translate3d(3%,-2%,0) scale(1.04); } }
    @keyframes barUp     { from { transform: scaleY(0); } }
    @keyframes livePulse { 0% { box-shadow: 0 0 0 0 var(--income-dim); } 70%,100% { box-shadow: 0 0 0 7px transparent; } }
    @keyframes rise      { from { opacity: 0; transform: translateY(18px) scale(.985); } }
    @keyframes fromRight { from { opacity: 0; transform: translateX(36px); } }
    @keyframes fromLeft  { from { opacity: 0; transform: translateX(-36px); } }
    @keyframes rowIn     { from { opacity: 0; transform: translateY(10px); } }
    @keyframes flash     { 0%,30% { background: var(--primary-dim); box-shadow: inset 3px 0 0 var(--primary); } 100% { background: transparent; box-shadow: inset 3px 0 0 transparent; } }
    @keyframes leave     { to { opacity: 0; transform: translateX(-40%) scale(.97); } }
    @keyframes sheetUp   { from { transform: translateY(100%); } }
    @keyframes sheetDown { to { transform: translateY(100%); } }
    @keyframes popIn     { from { opacity: 0; transform: translateY(16px) scale(.95); } }
    @keyframes popOut    { to { opacity: 0; transform: translateY(10px) scale(.96); } }
    @keyframes fadeIn    { from { opacity: 0; } }
    @keyframes fadeOut   { to { opacity: 0; } }
    @keyframes fabIn     { from { opacity: 0; transform: scale(.3) rotate(-90deg); } }
    @keyframes chipIn    { from { opacity: 0; transform: scale(.7); } }
    @keyframes chipPop   { 0% { transform: scale(.88); } 100% { transform: scale(1); } }
    @keyframes shake     { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
    @keyframes float     { 50% { transform: translateY(-6px); } }
    @keyframes sweep     { to { transform: translateX(120%); } }
    @keyframes nudgeL    { 40% { transform: translateX(-14px); } }
    @keyframes nudgeR    { 40% { transform: translateX(14px); } }
    @keyframes reveal    { from { clip-path: circle(0 at var(--vx) var(--vy)); } to { clip-path: circle(var(--vr) at var(--vx) var(--vy)); } }

    /* page load */
    .topbar { animation: fadeIn .6s ease backwards; }
    .months { animation: rise .7s var(--ease-out) .05s backwards; }
    .main > .list-head, .list-tools { animation: rise .6s var(--ease-out) .28s backwards; }
    /* first render, and month switches slide in the swipe direction */
    .enter .hero      { animation: rise .75s var(--ease-out) .1s backwards; }
    .enter .stat      { animation: rise .7s var(--ease-out) backwards; animation-delay: calc(var(--i) * 70ms + 200ms); }
    .enter .carry-banner, .enter .empty, .enter .days { animation: rise .6s var(--ease-out) .3s backwards; }
    .enter .tx-day    { animation: rise .6s var(--ease-out) backwards; animation-delay: calc(min(var(--i), 8) * 60ms + 320ms); }
    .slide-next > *, .slide-next .stat { animation: fromRight .5s var(--ease-out) backwards; }
    .slide-prev > *, .slide-prev .stat { animation: fromLeft .5s var(--ease-out) backwards; }
    .slide-next .stat, .slide-prev .stat { animation-delay: calc(var(--i) * 50ms); }
    .slide-next .tx-day, .slide-prev .tx-day { animation-delay: calc(min(var(--i), 6) * 45ms + 60ms); }
    .nudge-l { animation: nudgeL .4s var(--ease-out); }
    .nudge-r { animation: nudgeR .4s var(--ease-out); }
    .filtering .tx-day, .filtering .empty, .filtering .results { animation: rise .35s var(--ease-out) backwards; }
    .filtering .tx-day { animation-delay: calc(min(var(--i), 6) * 30ms); }
    .tx-row.tx-new { animation: flash 2s ease-out .35s backwards; }
    .tx-item.leaving { animation: leave .3s cubic-bezier(.4,0,1,1) forwards; pointer-events: none; }
    .tx-item.leaving .tx-row { transform: translateX(-100%) !important; transition: transform .3s cubic-bezier(.4,0,1,1); }
    .shake { animation: shake .4s ease; }

    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    ::view-transition-new(root) { animation: reveal .65s var(--ease-out); }

    /* ══════════ HOVER (mouse only) ══════════ */
    @media (hover: hover) {
      .icon-btn:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-dim); }
      .mchip:not(.active):hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
      .tx-row:hover { background: var(--card-hover); }
      .tx-row:hover .tx-desc { color: var(--primary); }
      .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 12px 32px var(--primary-glow); transform: translateY(-1px); }
      .btn-primary:hover::after { transform: translateX(120%); transition: transform .8s var(--ease-out); }
      .btn-danger:hover { background: rgba(255,107,136,.2); }
      .fab:hover { transform: translateY(-3px); box-shadow: 0 10px 22px -4px var(--primary-glow); }
      .chip:hover { border-color: var(--primary); color: var(--primary); }
      .set-item:hover { background: var(--card-hover); }
      .stat { transition: transform .35s var(--ease-out), box-shadow .35s; }
      .stat:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
      .brand-mark:hover .bar { animation: barUp .7s var(--ease-spring) backwards; }
      .brand-mark:hover .b2 { animation-delay: .08s; } .brand-mark:hover .b3 { animation-delay: .16s; }
      #guide-skip:hover { border-color: var(--expense); color: var(--expense); }
      .swipe-hint { display: none; }
    }

    /* ══════════ RESPONSIVE ══════════ */
    @media (max-width: 379px) {
      .brand-sub .full { display: none; }
      .stat-bgn { display: none; }
    }
    @media (min-width: 380px) { .brand-sub .short { display: none; } }

    /* Tablet: wider column, three stats in a row, sheets become centered dialogs */
    @media (min-width: 768px) {
      :root { --gutter: 28px; --maxw: 760px; }
      .stats.three { grid-template-columns: repeat(3, 1fr); }
      .stats .carry { grid-column: auto; }
      .hero { padding: 26px 28px 22px; }
      .sheet {
        inset: 0 0 var(--kb, 0px) 0; margin: auto; height: fit-content; max-width: 460px;
        border-radius: 28px; box-shadow: var(--shadow-lg), 0 1px 0 rgba(255,255,255,.08) inset;
      }
      .sheet[open] { animation: popIn .4s var(--ease-out); }
      .sheet.closing { animation: popOut .22s ease-in forwards; }
      .sheet-grab { display: none; }
      .sheet-inner { --pad: 26px; padding: 8px var(--pad) 24px; }
      .toast { bottom: 28px; }
    }

    /* Desktop: dashboard with sticky summary on the left */
    @media (min-width: 1080px) {
      :root { --gutter: 40px; --maxw: 1240px; }
      .topbar-in { height: 76px; }
      .layout { display: grid; grid-template-columns: 400px minmax(0,1fr); gap: 32px; align-items: start; }
      .side { position: sticky; top: 96px; }
      .list-head { margin-top: 6px; }
      .stats.three { grid-template-columns: 1fr 1fr; }
      .stats .carry { grid-column: 1 / -1; }
      .fab { display: none; }
      .topbar .btn-new { display: inline-flex; flex: none; height: var(--tap); padding: 0 18px; border-radius: 14px; font-size: .92rem; box-shadow: 0 6px 18px var(--primary-glow); }
      .months { margin-left: -10px; margin-right: -10px; padding-left: 10px; padding-right: 10px; -webkit-mask-image: none; mask-image: none; }
    }
    @media (min-width: 1440px) { :root { --maxw: 1360px; } .layout { grid-template-columns: 440px minmax(0,1fr); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
